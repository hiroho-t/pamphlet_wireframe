<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>og-005</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;left:0;top:0;width:794px;height:520px;background:#f0f0f0}
  .en{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:28px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .q{position:absolute;left:56px;width:390px;top:190px;font-size:22px;font-weight:800;line-height:1.85;letter-spacing:.03em;color:#1a1a1a}
  .x{position:absolute;left:56px;width:390px;top:340px;font-size:12px;line-height:2.15;color:#4d4d4d}
  .nm{position:absolute;left:56px;top:450px;font-size:11px;color:#8c8c8c}
  .nm b{font-size:14px;color:#1a1a1a}
  .sec{position:absolute;left:56px;top:580px;width:682px}
  .sec .t{font-size:12px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:9px;border-bottom:1px solid #1a1a1a}
  .sec .g{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .sec .im{width:100%;height:130px;background:#dcdcdc;display:grid;place-items:center;font-size:10px;letter-spacing:.16em;color:#8c8c8c}
  .sec .n{margin-top:10px;font-size:13px;font-weight:700;color:#1a1a1a}
  .sec .y{margin-top:5px;font-size:11px;line-height:1.85;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="ph" style="left:470px;top:76px;width:268px;height:380px">PORTRAIT</div>
    <div class="en">GRADUATE INTERVIEW</div>
    <div class="h1">卒業生インタビュー</div>
    <div class="q">ダミーのインタビュー<br>見出しが入ります</div>
    <div class="x">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="nm">ダミー株式会社／20XX年卒　<b>ダミー 花子</b></div>
    <div class="sec"><div class="t">ほかの卒業生</div><div class="g">
      <div><div class="im">PHOTO</div><div class="n">ダミー 太郎</div><div class="y">ダミー株式会社<br>20XX年卒</div></div>
      <div><div class="im">PHOTO</div><div class="n">ダミー 一郎</div><div class="y">ダミー株式会社<br>20XX年卒</div></div>
      <div><div class="im">PHOTO</div><div class="n">ダミー 次郎</div><div class="y">ダミー株式会社<br>20XX年卒</div></div>
    </div></div>
    <div class="pn" style="left:56px;top:1060px">56</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
