<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-024</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .eye{position:absolute;left:56px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:124px;font-size:34px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .mp{position:absolute;left:56px;top:230px;width:800px;height:480px;background:#dcdcdc;display:grid;place-items:center;font-size:13px;letter-spacing:.2em;color:#8c8c8c}
  .tb{position:absolute;left:900px;top:230px;width:632px;border-collapse:collapse;font-size:11px}
  .tb th{background:#6b6b6b;color:#fff;padding:10px 10px;text-align:left;font-size:10.5px;font-weight:700}
  .tb td{padding:11px 10px;border-bottom:1px solid #e6e6e6;color:#4d4d4d;line-height:1.7}
  .tb td.n{font-weight:700;color:#1a1a1a}
  .st{position:absolute;width:196px;height:120px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:6px}
  .st .l{font-size:10.5px;color:#8c8c8c}
  .st .v{font-size:28px;font-weight:800;line-height:1;color:#1a1a1a}
  .st .v small{font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">GLOBAL NETWORK</div>
    <div class="h1">世界とつながる学び</div>
    <div class="mp">WORLD MAP</div>
    <table class="tb"><thead><tr><th style="width:110px">国・地域</th><th style="width:210px">協定校</th><th>種別</th></tr></thead><tbody>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>交換留学</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>交換留学</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>語学研修</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>短期研修</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>学術交流</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>交換留学</td></tr>
    </tbody></table>
    <div class="st" style="left:900px;top:560px"><div class="l">協定校</div><div class="v">28<small>校</small></div></div>
    <div class="st" style="left:1118px;top:560px"><div class="l">派遣者数</div><div class="v">120<small>名</small></div></div>
    <div class="st" style="left:1336px;top:560px"><div class="l">受入留学生</div><div class="v">86<small>名</small></div></div>
    <div class="ph" style="left:56px;top:750px;width:800px;height:270px">IMAGE</div>
    <div class="ph" style="left:900px;top:720px;width:632px;height:300px">IMAGE</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px">36</div>
    <div class="pn" style="right:56px;top:1064px">37</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
