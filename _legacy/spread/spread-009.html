<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-009</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .eye{position:absolute;left:56px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:124px;font-size:34px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .cp{position:absolute;left:56px;width:620px;top:200px;font-size:20px;font-weight:700;line-height:1.85;color:#1a1a1a}
  .bd{position:absolute;left:56px;width:620px;top:320px;column-count:2;column-gap:36px;font-size:12px;line-height:2.15;color:#4d4d4d}
  .t{position:absolute;left:56px;width:682px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
  .li{position:absolute;left:56px;width:682px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 30px}
  .li div{padding:8px 0;border-bottom:1px solid #ececec;font-size:11.5px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">DEPARTMENT OF DUMMY</div>
    <div class="h1">ダミー学科</div>
    <div class="cp">ダミーのキャッチコピーが<br>ここに入ります</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="t" style="top:560px">主な専門科目</div>
    <div class="li" style="top:610px"><div>ダミーの科目名</div><div>ダミーの科目名</div><div>ダミーの科目名</div><div>ダミーの科目名</div><div>ダミーの科目名</div><div>ダミーの科目名</div><div>ダミーの科目名</div><div>ダミーの科目名</div></div>
    <div class="ph" style="left:56px;top:820px;width:333px;height:200px">IMAGE</div>
    <div class="ph" style="left:405px;top:820px;width:333px;height:200px">IMAGE</div>
    <div class="ph" style="left:794px;top:0;width:794px;height:1123px;font-size:14px">MAIN IMAGE（右ページ全面）</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px">12</div>
    <div class="pn" style="right:56px;top:1064px;color:#fff">13</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
