<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-017</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .band{position:absolute;left:0;top:380px;width:1588px;height:230px;background:#fff;display:flex;align-items:center;padding-left:56px;gap:40px}
  .band .n{font-size:13px;letter-spacing:.3em;color:#8c8c8c}
  .band .t{font-size:56px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .band .x{width:420px;font-size:12.5px;line-height:2.1;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:1588px;height:1123px;background:#c4c4c4;font-size:15px">IMAGE（見開き全面）</div>
    <div class="band"><div><div class="n">CHAPTER 01</div><div class="t">ダミーの章タイトル</div></div><div class="x">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div></div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px;color:#fff">03</div>
    <div class="pn" style="right:56px;top:1064px;color:#fff">04</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
