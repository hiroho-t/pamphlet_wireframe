<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-027</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .eye{position:absolute;left:56px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:124px;font-size:34px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .q{position:absolute;left:850px;width:620px;top:96px;font-size:28px;font-weight:800;line-height:1.85;letter-spacing:.03em;color:#1a1a1a}
  .bd{position:absolute;left:850px;width:682px;top:320px;column-count:2;column-gap:40px;font-size:12px;line-height:2.25;color:#4d4d4d}
  .nm{position:absolute;left:850px;top:900px;font-size:11px;color:#8c8c8c}
  .nm b{display:block;margin-top:5px;font-size:20px;font-weight:800;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;font-size:14px">PORTRAIT（左ページ全面）</div>
    <div class="q">ダミーのメッセージ引用が<br>ここに入ります。</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:850px;top:700px;width:682px;height:170px">IMAGE</div>
    <div class="nm">学長<b>ダミー 太郎</b></div>
    <div class="ph" style="left:1400px;top:890px;width:132px;height:100px">SIGN</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px;color:#fff">04</div>
    <div class="pn" style="right:56px;top:1064px">05</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
