<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-005</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .en{position:absolute;left:56px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:124px;font-size:34px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .cap{position:absolute;font-size:10.5px;line-height:1.7;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">CAMPUS SNAPSHOTS</div>
    <div class="h1">キャンパスの風景</div>
    <div class="ph" style="left:56px;top:210px;width:480px;height:330px">IMAGE</div>
    <div class="cap" style="left:56px;top:550px;width:480px">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:552px;top:210px;width:204px;height:160px">IMAGE</div>
    <div class="ph" style="left:552px;top:380px;width:204px;height:160px">IMAGE</div>
    <div class="ph" style="left:850px;top:210px;width:330px;height:330px">IMAGE</div>
    <div class="ph" style="left:1196px;top:210px;width:336px;height:160px">IMAGE</div>
    <div class="ph" style="left:1196px;top:380px;width:336px;height:160px">IMAGE</div>
    <div class="ph" style="left:56px;top:600px;width:236px;height:200px">IMAGE</div>
    <div class="ph" style="left:308px;top:600px;width:236px;height:200px">IMAGE</div>
    <div class="ph" style="left:560px;top:600px;width:196px;height:200px">IMAGE</div>
    <div class="ph" style="left:850px;top:600px;width:196px;height:200px">IMAGE</div>
    <div class="ph" style="left:1062px;top:600px;width:236px;height:200px">IMAGE</div>
    <div class="ph" style="left:1314px;top:600px;width:218px;height:200px">IMAGE</div>
    <div class="ph" style="left:56px;top:820px;width:700px;height:200px">IMAGE</div>
    <div class="ph" style="left:850px;top:820px;width:682px;height:200px">IMAGE</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px">40</div>
    <div class="pn" style="right:56px;top:1064px">41</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
