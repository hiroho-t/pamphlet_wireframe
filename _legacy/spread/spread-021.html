<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-021</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .eye{position:absolute;left:56px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:124px;font-size:34px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .ly{position:absolute;left:56px;width:1476px;display:grid;place-items:center;font-weight:700;color:#1a1a1a}
  .l1{height:80px;background:#6b6b6b;color:#fff;font-size:18px;letter-spacing:.08em}
  .l2{height:72px;background:#c9c9c9;font-size:16px}
  .l3{height:72px;background:#dedede;font-size:15px}
  .l4{height:72px;background:#f0f0f0;font-size:14px}
  .tag{position:absolute;left:0;width:1588px;display:flex;justify-content:center;gap:12px}
  .tag span{padding:9px 16px;border:1px solid #d5d5d5;font-size:12px;color:#4d4d4d}
  .lead{position:absolute;left:394px;width:800px;text-align:center;font-size:12.5px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CURRICULUM STRUCTURE</div>
    <div class="h1">学びの体系</div>
    <div class="ly l1" style="top:240px">卒業研究・卒業制作</div>
    <div class="ly l2" style="top:350px">専門応用科目</div>
    <div class="ly l3" style="top:446px">専門基礎科目</div>
    <div class="ly l4" style="top:542px">共通教養科目</div>
    <div class="tag" style="top:660px"><span>ダミーの科目群</span><span>ダミーの科目群</span><span>ダミーの科目群</span><span>ダミーの科目群</span><span>ダミーの科目群</span></div>
    <div class="lead" style="top:730px">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:820px;width:682px;height:200px">IMAGE</div>
    <div class="ph" style="left:850px;top:820px;width:682px;height:200px">IMAGE</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px">18</div>
    <div class="pn" style="right:56px;top:1064px">19</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
