<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-031</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .ttl{position:absolute;left:0;width:794px;top:110px;text-align:center;font-size:46px;font-weight:800;line-height:1.4;letter-spacing:.06em;color:#1a1a1a}
  .lst{position:absolute;left:0;width:794px;top:860px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;padding:0 56px}
  .lst span{font-size:12px;letter-spacing:.06em;color:#4d4d4d}
  .logo{position:absolute;left:0;width:794px;top:1000px;text-align:center;font-size:18px;font-weight:800;letter-spacing:.14em;color:#1a1a1a}
  .yr{position:absolute;left:0;width:794px;top:1042px;text-align:center;font-size:10px;letter-spacing:.28em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ttl">ダミーの<br>キャッチコピー</div>
    <div class="ph" style="left:56px;top:300px;width:682px;height:520px">MAIN IMAGE</div>
    <div class="lst"><span>ダミー学部</span><span>ダミー学部</span><span>ダミー学部</span><span>ダミー学部</span><span>ダミー学部</span><span>ダミー学部</span></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">SCHOOL GUIDE BOOK 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
