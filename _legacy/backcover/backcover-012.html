<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backcover-012</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .l{position:absolute;left:0;top:0;width:264px;height:1123px;background:#f0f0f0}
  .logo{position:absolute;left:40px;top:100px;width:184px;font-size:20px;font-weight:800;line-height:1.6;letter-spacing:.1em;color:#1a1a1a}
  .ad{position:absolute;left:40px;top:220px;width:184px;font-size:11px;line-height:2.05;color:#4d4d4d}
  .sns{position:absolute;left:40px;top:520px;width:184px;display:flex;flex-wrap:wrap;gap:10px}
  .sns .i{width:86px;height:86px;background:#dcdcdc;display:grid;place-items:center;font-size:9px;color:#8c8c8c}
  .cp{position:absolute;left:40px;top:1044px;font-size:10px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="l"></div>
    <div class="ph" style="left:264px;top:0;width:530px;height:1123px;font-size:13px">IMAGE</div>
    <div class="logo">SCHOOL<br>LOGO</div>
    <div class="ad">学校法人ダミー学園<br>ダミー大学 入試広報課<br><br>〒000-0000<br>ダミー県ダミー市ダミー町0-0-0<br>TEL 000-000-0000<br>https://dummy.example.ac.jp/</div>
    <div class="sns"><div class="i">QR</div><div class="i">QR</div><div class="i">QR</div><div class="i">QR</div></div>
    <div class="cp">© 20XX Dummy School.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
