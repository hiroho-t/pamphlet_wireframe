<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .b{position:absolute;left:56px;width:682px;background:#f0f0f0;padding:22px 26px}
  .b .t{font-size:15px;font-weight:800;color:#1a1a1a}
  .b .g{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .b .g .it{background:#fff;padding:14px}
  .b .g .n{font-size:9.5px;letter-spacing:.16em;color:#8c8c8c}
  .b .g .h{margin-top:5px;font-size:12.5px;font-weight:700;line-height:1.5;color:#1a1a1a}
  .b .g .x{margin-top:6px;font-size:10px;line-height:1.75;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">INTERNSHIP</div>
    <div class="h1">インターンシップ</div>
    <div class="ph" style="left:56px;top:180px;width:682px;height:230px">IMAGE</div>
    <div class="b" style="top:440px"><div class="t">受入企業と分野</div><div class="g">
      <div class="it"><div class="n">FIELD 01</div><div class="h">ダミーの分野</div><div class="x">受入：00社</div></div>
      <div class="it"><div class="n">FIELD 02</div><div class="h">ダミーの分野</div><div class="x">受入：00社</div></div>
      <div class="it"><div class="n">FIELD 03</div><div class="h">ダミーの分野</div><div class="x">受入：00社</div></div>
      <div class="it"><div class="n">FIELD 04</div><div class="h">ダミーの分野</div><div class="x">受入：00社</div></div>
    </div></div>
    <div class="b" style="top:680px"><div class="t">参加までの流れ</div><div class="g">
      <div class="it"><div class="n">STEP 01</div><div class="h">ダミーの見出し</div><div class="x">ダミーテキストダミー</div></div>
      <div class="it"><div class="n">STEP 02</div><div class="h">ダミーの見出し</div><div class="x">ダミーテキストダミー</div></div>
      <div class="it"><div class="n">STEP 03</div><div class="h">ダミーの見出し</div><div class="x">ダミーテキストダミー</div></div>
      <div class="it"><div class="n">STEP 04</div><div class="h">ダミーの見出し</div><div class="x">ダミーテキストダミー</div></div>
    </div></div>
    <div class="ph" style="left:56px;top:920px;width:682px;height:100px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">50</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
