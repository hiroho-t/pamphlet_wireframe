<title>career-001</title>
<style>

  .stage{position:fixed;inset:0;overflow:hidden}

  .st{position:absolute;width:213px;height:160px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:8px}
  .st .lb{font-size:11px;color:#8c8c8c}
  .st .vl{font-size:44px;font-weight:800;line-height:1;color:#1a1a1a}

  .st .nt{font-size:10px;color:#8c8c8c}
  .gh{position:absolute;left:56px;top:400px;width:682px;height:210px;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .t{position:absolute;left:56px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a}
  .lst{position:absolute;left:56px;width:682px;column-count:3;column-gap:30px;font-size:11.5px;line-height:2.1;color:#4d4d4d}

</head>
