<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-009</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .st{position:absolute;width:213px;height:150px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:7px}
  .st .l{font-size:11px;color:#8c8c8c}
  .st .v{font-size:38px;font-weight:800;line-height:1;color:#1a1a1a}
  .st .v small{font-size:14px}
  .st .n{font-size:10px;color:#8c8c8c}
  .bd{position:absolute;left:56px;width:682px;top:530px;font-size:12px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CAREER DATA</div>
    <div class="h1">就職実績データ</div>
    <div class="st" style="left:56px;top:180px"><div class="l">就職率</div><div class="v">98.5<small>%</small></div><div class="n">20XX年度</div></div>
    <div class="st" style="left:290px;top:180px"><div class="l">県内就職率</div><div class="v">62<small>%</small></div><div class="n">20XX年度</div></div>
    <div class="st" style="left:524px;top:180px"><div class="l">大学院進学率</div><div class="v">12<small>%</small></div><div class="n">20XX年度</div></div>
    <div class="st" style="left:56px;top:350px"><div class="l">求人倍率</div><div class="v">7.2<small>倍</small></div><div class="n">20XX年度</div></div>
    <div class="st" style="left:290px;top:350px"><div class="l">求人企業数</div><div class="v">1,200<small>社</small></div><div class="n">20XX年度</div></div>
    <div class="st" style="left:524px;top:350px"><div class="l">卒業生総数</div><div class="v">28,000<small>名</small></div><div class="n">創立以来</div></div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:630px;width:682px;height:390px">GRAPH</div>
    <div class="pn" style="left:56px;top:1060px">50</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
