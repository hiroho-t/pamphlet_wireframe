<title>pamphlet-wireframe｜レイアウト一覧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#fafafa; --ink:#2f2725; --sub:#8b8583; --line:#e2dfdd;
    --field:#f1f1f1; --link:#0062db; --r:6px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  header{padding:40px 40px 30px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:48px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:800;letter-spacing:.06em}
  header p{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.9;letter-spacing:.04em}

  .get{flex:1 1 340px;min-width:0;max-width:400px;padding:16px 18px;
    background:#fff;border:1px solid var(--line);border-radius:8px}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  .btn{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;
    font-size:12px;font-weight:700;letter-spacing:.06em;text-decoration:none;border-radius:var(--r);
    border:1px solid var(--ink);background:var(--ink);color:#fff}
  .btn.sub{background:transparent;color:var(--ink)}
  .btn:hover{opacity:.75}
  .btn.sub:hover{background:var(--field);opacity:1}
  .btn svg{width:15px;height:15px;fill:currentColor;flex:none}
  .cmd{display:flex;align-items:stretch;margin-top:10px;background:var(--field);border-radius:8px;overflow:hidden}
  .cmd code{flex:1;min-width:0;padding:11px 12px 10px;font-size:10px;line-height:1.5;color:#555;background:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmd button{flex:none;width:62px;border:0;border-left:1px solid #e2e2e2;background:none;
    font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink);cursor:pointer;font-family:inherit}
  .cmd button:hover{background:#e7e7e7}

  .catbar{display:flex;flex-wrap:wrap;gap:8px;padding:13px 40px 15px;border-bottom:1px solid var(--line)}
  .catbar a{display:inline-flex;align-items:baseline;gap:7px;padding:7px 12px 6px;
    border:1px solid var(--line);border-radius:var(--r);background:#fff;
    font-size:12px;letter-spacing:.06em;color:var(--ink);text-decoration:none}
  .catbar a:hover{border-color:var(--ink)}
  .catbar a span{font-size:10px;color:var(--sub);letter-spacing:0}

  .menubtn{position:fixed;right:24px;bottom:24px;z-index:40;width:52px;height:52px;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    border:1px solid var(--ink);border-radius:var(--r);background:var(--ink);cursor:pointer}
  .menubtn i{display:block;width:20px;height:1.5px;background:#fff}
  .menubtn[aria-expanded="true"] i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  .menubtn[aria-expanded="true"] i:nth-child(2){opacity:0}
  .menubtn[aria-expanded="true"] i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
  .mask{position:fixed;inset:0;z-index:30;background:none}
  .mask[hidden],.catnav[hidden]{display:none}
  .catnav{position:fixed;right:24px;bottom:88px;z-index:40;width:272px;
    max-height:calc(100vh - 136px);overflow-y:auto;padding:8px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 28px rgba(47,39,37,.10)}
  .catnav a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:9px 11px;border-radius:var(--r);
    font-size:12px;letter-spacing:.06em;color:var(--ink);text-decoration:none}
  .catnav a:hover{background:var(--field)}
  .catnav a span{font-size:10px;color:var(--sub);letter-spacing:0}

  main{padding:0 40px 64px}
  section{padding-top:44px;scroll-margin-top:24px}
  h2{font-size:15px;font-weight:800;letter-spacing:.1em;padding-bottom:14px;border-bottom:1px solid var(--line)}
  h2 span{font-size:11px;font-weight:400;color:var(--sub);margin-left:12px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,232px),1fr));gap:26px;margin-top:24px}
  .card{display:block}
  .thumb{position:relative;display:block;width:100%;aspect-ratio:var(--ar,794/1123);background:#fff;
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .thumb iframe{width:100%;height:100%;border:0;pointer-events:none;display:block}
  .thumb::after{content:"";position:absolute;inset:0}
  .thumb:hover{border-color:var(--ink)}
  .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:12px}
  .id{display:inline-flex;align-items:baseline;gap:6px;flex:none;
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);
    background:none;border:0;padding:0;cursor:pointer}
  .id i{font-size:9px;color:#b5b0ad;transform:translateY(-1px)}
  .id:hover{text-decoration:underline;text-underline-offset:3px}
  .id:hover i{color:var(--ink)}
  .id.done{color:var(--sub)}
  .id.done i{color:var(--sub)}
  .dl{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--link);
    text-decoration:none;white-space:nowrap}
  .dl:hover{text-decoration:underline;text-underline-offset:2px}

  @media (max-width:900px){
    header{padding:30px 24px 24px;gap:24px}
    .get{flex:1 1 100%;max-width:none}
    main{padding:0 24px 48px}
    .catbar{padding:11px 24px 13px}
    .menubtn{right:16px;bottom:16px}
    .catnav{right:16px;bottom:80px;width:auto;left:16px;max-width:280px;margin-left:auto}
  }
</style>
</head>

document.getElementById('copy').addEventListener('click', async (e) => {
  const btn = e.currentTarget, text = document.getElementById('cmd').textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'コピー済'; }
  catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('cmd'));
          getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = '選択'; }
  setTimeout(() => btn.textContent = 'コピー', 1600);
});

  return `
  <section id="${dir}" style="--ar:${ar};--w:${wide ? '400px' : '232px'}">

    <div class="grid">
      ${items.map(id => `
        <div class="card">
          <a class="thumb" href="${dir}/${id}.html" target="_blank" rel="noopener"><iframe src="${dir}/${id}.html" loading="lazy" scrolling="no" title="${id}"></iframe></a>
          <div class="cap">
            <button type="button" class="id" data-id="${id}" title="IDをコピー">${id}<i class="fa-regular fa-copy"></i></button>
            <a class="dl" href="${REPO}/blob/main/${dir}/${id}.html" target="_blank" rel="noopener">コードを見る</a>
          </div>
        </div>`).join('')}
    </div>
  </section>`;
}).join('');

const LINKS = DATA.map(([label, dir, ar, items]) =>
  `<a href="#${dir}">${label}<span>${items.length}</span></a>`).join('');
const nav = document.getElementById('catnav');
nav.innerHTML = LINKS;
document.getElementById('catbar').innerHTML = LINKS;

const menubtn = document.getElementById('menubtn'), mask = document.getElementById('mask');
const setOpen = (open) => {
  menubtn.setAttribute('aria-expanded', open);
  nav.hidden = !open; mask.hidden = !open;
};
menubtn.addEventListener('click', () => setOpen(menubtn.getAttribute('aria-expanded') !== 'true'));
mask.addEventListener('click', () => setOpen(false));
nav.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });

document.getElementById('app').addEventListener('click', async (e) => {
  const btn = e.target.closest('.id');
  if (!btn) return;
  const id = btn.dataset.id;
  try { await navigator.clipboard.writeText(id); }
  catch { const r = document.createRange(); r.selectNodeContents(btn);
          getSelection().removeAllRanges(); getSelection().addRange(r); }
  btn.classList.add('done');
  btn.innerHTML = 'コピーしました<i class="fa-solid fa-check"></i>';
  setTimeout(() => { btn.classList.remove('done');
    btn.innerHTML = id + '<i class="fa-regular fa-copy"></i>'; }, 1200);
});
</script>
