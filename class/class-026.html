<style>

  .g .im{width:100%;height:110px;background:#dcdcdc;display:grid;place-items:center;font-size:9px;color:#8c8c8c}

  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
