<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>class-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .hd{position:absolute;left:0;top:0;width:794px;height:120px;background:#f0f0f0}
  .en{position:absolute;left:56px;top:38px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:62px;font-size:26px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .cap{position:absolute;font-size:10.5px;line-height:1.75;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="hd"></div>
    <div class="en">WORKSHOP REPORT</div>
    <div class="h1">実習レポート</div>

    <div class="cap" style="left:56px;top:470px;width:450px">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:526px;top:160px;width:212px;height:145px">IMAGE</div>
    <div class="ph" style="left:526px;top:315px;width:212px;height:145px">IMAGE</div>
    <div class="ph" style="left:56px;top:540px;width:220px;height:160px">IMAGE</div>
    <div class="cap" style="left:56px;top:710px;width:220px">ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:287px;top:540px;width:220px;height:160px">IMAGE</div>
    <div class="cap" style="left:287px;top:710px;width:220px">ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:518px;top:540px;width:220px;height:160px">IMAGE</div>
    <div class="cap" style="left:518px;top:710px;width:220px">ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:790px;width:682px;height:220px">IMAGE</div>
    <div class="pn" style="right:56px;top:1050px">26</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
