<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backcover-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;left:0;top:0;width:794px;height:560px;background:#f0f0f0}
  .logo{position:absolute;left:0;width:794px;top:200px;text-align:center;font-size:30px;font-weight:800;letter-spacing:.16em;color:#1a1a1a}
  .ct{position:absolute;left:0;width:794px;top:256px;text-align:center;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .ttl{position:absolute;left:0;width:794px;top:320px;text-align:center;font-size:20px;font-weight:700;letter-spacing:.1em;color:#4d4d4d}
  .ad{position:absolute;left:0;width:794px;top:640px;text-align:center;font-size:11.5px;line-height:2.1;color:#4d4d4d}
  .cp{position:absolute;left:0;width:794px;top:1044px;text-align:center;font-size:10px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="ct">SCHOOL GUIDE BOOK 20XX</div>
    <div class="ttl">ダミーのキャッチコピーが入ります</div>
    <div class="ph" style="left:337px;top:400px;width:120px;height:120px">QR</div>
    <div class="ad">学校法人ダミー学園 ダミー大学 入試広報課<br>〒000-0000 ダミー県ダミー市ダミー町0-0-0<br>TEL 000-000-0000／https://dummy.example.ac.jp/</div>
    <div class="ph" style="left:56px;top:790px;width:682px;height:220px">IMAGE</div>
    <div class="cp">© 20XX Dummy School.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
