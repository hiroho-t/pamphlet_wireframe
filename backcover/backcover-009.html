<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backcover-009</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#1a1a1a}
  .logo{position:absolute;left:0;width:794px;top:380px;text-align:center;font-size:32px;font-weight:800;letter-spacing:.18em;color:#fff}
  .ln{position:absolute;left:337px;top:450px;width:120px;height:1px;background:#fff}
  .ct{position:absolute;left:0;width:794px;top:482px;text-align:center;font-size:11px;letter-spacing:.3em;color:#b5b5b5}
  .ad{position:absolute;left:0;width:794px;top:560px;text-align:center;font-size:11.5px;line-height:2.1;color:#d5d5d5}
  .cp{position:absolute;left:0;width:794px;top:1044px;text-align:center;font-size:10px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="ln"></div>
    <div class="ct">SCHOOL GUIDE BOOK 20XX</div>
    <div class="ad">学校法人ダミー学園 ダミー大学 入試広報課<br>〒000-0000 ダミー県ダミー市ダミー町0-0-0<br>TEL 000-000-0000／https://dummy.example.ac.jp/</div>
    <div class="ph" style="left:342px;top:720px;width:110px;height:110px;background:#4d4d4d;color:#c9c9c9">QR</div>
    <div class="cp">© 20XX Dummy School.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
