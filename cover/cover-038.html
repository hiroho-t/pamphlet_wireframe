<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-038</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1123px;height:794px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  /* 表紙（A4横）：淡い地に切り抜き人物を右へ寄せ、筆記体の特大タグラインと左下のロゴロックアップだけで構成する */
  .bg{position:absolute;inset:0;background:#f0f0f0}
  .sc{position:absolute;left:122px;top:362px;font-size:62px;font-style:italic;letter-spacing:.02em;color:#fff}
  .lock{position:absolute;left:107px;top:636px;display:flex;align-items:flex-end;gap:12px}
  .lock .b{flex:none;width:91px;height:80px;border:2px solid #6b6b6b;display:grid;place-items:center;font-size:11px;font-weight:800;color:#6b6b6b}
  .lock .o{font-size:9px;color:#4d4d4d}
  .lock .n{margin-top:4px;font-size:29px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}
  .lock .s{margin-top:3px;font-size:7.5px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="ph" style="left:462px;top:66px;width:610px;height:728px;font-size:13px">PORTRAIT（切り抜き）</div>
    <div class="sc">Dummy Tagline</div>
    <div class="lock"><div class="b">LOGO</div><div><div class="o">学校法人ダミー学園</div><div class="n">ダミー衛生専門学校</div><div class="s">ダミー専門課程 認定校</div></div></div>
    <div class="pn" style="right:20px;top:762px">1</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1123,innerHeight/794));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
