<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-003</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .cat{position:absolute;left:56px;top:646px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .ttl{position:absolute;left:56px;top:684px;font-size:46px;font-weight:800;line-height:1.4;letter-spacing:.04em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:430px;top:850px;font-size:13px;line-height:2.15;color:#4d4d4d}
  .logo{position:absolute;left:56px;top:1020px;font-size:20px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .yr{position:absolute;right:56px;top:1024px;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .rule{position:absolute;left:56px;top:994px;width:682px;height:1px;background:#d5d5d5}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:600px">MAIN IMAGE</div>
    <div class="cat">SCHOOL GUIDE 20XX</div>
    <div class="ttl">ダミーのキャッチ<br>コピーが入ります</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="rule"></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">GUIDE BOOK 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
