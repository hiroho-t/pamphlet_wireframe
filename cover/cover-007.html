<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .logo{position:absolute;left:0;width:794px;top:404px;text-align:center;font-size:30px;font-weight:800;letter-spacing:.18em;color:#1a1a1a}
  .rule{position:absolute;left:317px;top:470px;width:160px;height:1px;background:#1a1a1a}
  .cat{position:absolute;left:0;width:794px;top:500px;text-align:center;font-size:11px;letter-spacing:.34em;color:#8c8c8c}
  .yr{position:absolute;left:0;width:794px;top:532px;text-align:center;font-size:34px;font-weight:800;letter-spacing:.06em;color:#1a1a1a}
  .ttl{position:absolute;left:0;width:794px;top:790px;text-align:center;font-size:14px;letter-spacing:.14em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="logo">SCHOOL LOGO</div>
    <div class="rule"></div>
    <div class="cat">SCHOOL GUIDE BOOK</div>
    <div class="yr">20XX</div>
    <div class="ttl">ダミーのキャッチコピーが入ります</div>
    <div class="ph" style="left:0;top:860px;width:264px;height:263px">IMAGE 1</div>
    <div class="ph" style="left:265px;top:860px;width:264px;height:263px;background:#d0d0d0">IMAGE 2</div>
    <div class="ph" style="left:530px;top:860px;width:264px;height:263px">IMAGE 3</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
