<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-022</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .band{position:absolute;left:0;top:0;width:794px;height:170px;background:#fff}
  .logo{position:absolute;left:56px;top:56px;font-size:24px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .yr{position:absolute;right:56px;top:62px;font-size:26px;font-weight:800;color:#1a1a1a}
  .ct{position:absolute;left:56px;top:104px;font-size:11px;letter-spacing:.28em;color:#8c8c8c}
  .ttl{position:absolute;left:56px;top:940px;font-size:38px;font-weight:800;letter-spacing:.06em;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#b9b9b9;font-size:14px">MAIN IMAGE（全面）</div>
    <div class="band"></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="ct">SCHOOL GUIDE BOOK</div>
    <div class="yr">20XX</div>
    <div class="ttl">ダミーのキャッチコピー</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
