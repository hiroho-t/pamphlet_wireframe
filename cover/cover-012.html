<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-012</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#6b6b6b}
  .box{position:absolute;left:117px;top:340px;width:560px;height:440px;border:1px solid #fff;display:grid;place-items:center;align-content:center;gap:22px}
  .box .lg{font-size:26px;font-weight:800;letter-spacing:.16em;color:#fff}
  .box .ln{width:80px;height:1px;background:#fff}
  .box .ct{font-size:11px;letter-spacing:.32em;color:#e0e0e0}
  .box .yr{font-size:40px;font-weight:800;letter-spacing:.06em;color:#fff}
  .ttl{position:absolute;left:0;width:794px;top:836px;text-align:center;font-size:14px;letter-spacing:.16em;color:#e6e6e6}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="box"><div class="lg">SCHOOL LOGO</div><div class="ln"></div><div class="ct">SCHOOL GUIDE BOOK</div><div class="yr">20XX</div></div>
    <div class="ttl">ダミーのキャッチコピーが入ります</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
