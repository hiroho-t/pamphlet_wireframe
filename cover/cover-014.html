<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-014</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .logo{position:absolute;left:56px;top:80px;font-size:19px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .yr{position:absolute;right:56px;top:84px;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .ttl{position:absolute;left:56px;top:240px;font-size:54px;font-weight:800;line-height:1.4;letter-spacing:.05em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:460px;top:420px;font-size:13px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">SCHOOL GUIDE 20XX</div>
    <div class="ttl">ダミーの<br>キャッチコピー</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:0;top:562px;width:397px;height:561px">IMAGE 1</div>
    <div class="ph" style="left:397px;top:562px;width:397px;height:561px;background:#d0d0d0">IMAGE 2</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
