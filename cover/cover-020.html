<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-020</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .top{position:absolute;left:0;top:0;width:794px;height:70px;background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
  .top .lg{font-size:15px;font-weight:800;letter-spacing:.14em;color:#fff}
  .top .yr{font-size:11px;letter-spacing:.2em;color:#d5d5d5}
  .ttl{position:absolute;left:0;width:794px;top:180px;text-align:center;font-size:50px;font-weight:800;line-height:1.4;letter-spacing:.06em;color:#1a1a1a}
  .lead{position:absolute;left:177px;width:440px;top:360px;text-align:center;font-size:12.5px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="top"><div class="lg">SCHOOL LOGO</div><div class="yr">SCHOOL GUIDE 20XX</div></div>
    <div class="ttl">ダミーの<br>キャッチコピー</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:0;top:490px;width:794px;height:633px">MAIN IMAGE</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
