<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-036</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  /* 表紙：全面写真に縦組みコピーを左上、ロゴを右上、校名と枠付きチップを下部中央に置く */
  .mn{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .vc{position:absolute;left:84px;top:62px;height:352px;writing-mode:vertical-rl;font-size:17px;letter-spacing:.2em;line-height:1.9;color:#1a1a1a}
  .lg{position:absolute;left:504px;top:70px;width:225px;text-align:right;font-size:34px;font-style:italic;letter-spacing:.02em;color:#fff}
  .nm{position:absolute;left:0;width:794px;top:910px;text-align:center;font-size:26px;letter-spacing:.06em;color:#fff}
  .cp{position:absolute;left:268px;top:996px;width:256px;height:46px;border:1px solid #fff;display:grid;place-items:center;font-size:15px;letter-spacing:.3em;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#c4c4c4;font-size:14px">MAIN IMAGE（全面）</div>
    <div class="vc mn">つくるのは、<br>ダミーの可能性だ。</div>
    <div class="lg">dummy</div>
    <div class="nm mn">ダミー調理師専門学校 20XX</div>
    <div class="cp mn">調理 ／ 製菓</div>
    <div class="pn" style="right:20px;top:1092px;color:#fff">1</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
