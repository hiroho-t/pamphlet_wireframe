<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#6b6b6b}
  .ttl{position:absolute;right:64px;top:180px;text-align:right;font-size:58px;font-weight:800;line-height:1.35;letter-spacing:.05em;color:#fff}
  .lead{position:absolute;right:64px;width:420px;top:420px;text-align:right;font-size:12.5px;line-height:2.15;color:#e6e6e6}
  .logo{position:absolute;right:64px;top:1000px;text-align:right;font-size:19px;font-weight:800;letter-spacing:.12em;color:#fff}
  .yr{position:absolute;left:64px;top:1004px;font-size:12px;letter-spacing:.2em;color:#d5d5d5}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="ttl">ダミーの<br>キャッチコピー</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:64px;top:560px;width:330px;height:380px;background:#8f8f8f;color:#e8e8e8">IMAGE</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">SCHOOL GUIDE 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
