<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .logo{position:absolute;left:0;width:794px;top:96px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.16em;color:#1a1a1a}
  .cat{position:absolute;left:0;width:794px;top:136px;text-align:center;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .ttl{position:absolute;left:0;width:794px;top:236px;text-align:center;font-size:52px;font-weight:800;line-height:1.45;letter-spacing:.06em;color:#1a1a1a}
  .lead{position:absolute;left:167px;width:460px;top:414px;text-align:center;font-size:13px;line-height:2.2;color:#4d4d4d}
  .yr{position:absolute;left:0;width:794px;top:1042px;text-align:center;font-size:13px;letter-spacing:.24em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="logo">SCHOOL LOGO</div>
    <div class="cat">SCHOOL GUIDE BOOK</div>
    <div class="ttl">ダミーの<br>キャッチコピー</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキスト<br>ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:520px;width:682px;height:460px">MAIN IMAGE</div>
    <div class="yr">20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
