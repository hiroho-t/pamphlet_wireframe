<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .vt{position:absolute;right:64px;top:96px;height:700px;writing-mode:vertical-rl;font-size:50px;font-weight:800;line-height:1.5;letter-spacing:.16em;color:#fff}
  .vs{position:absolute;right:150px;top:96px;height:420px;writing-mode:vertical-rl;font-size:14px;line-height:2.2;letter-spacing:.12em;color:#f0f0f0}
  .shade{position:absolute;left:0;bottom:0;width:794px;height:300px;background:rgba(0,0,0,.15)}
  .logo{position:absolute;left:56px;top:1016px;font-size:20px;font-weight:800;letter-spacing:.12em;color:#fff}
  .yr{position:absolute;right:56px;top:1020px;font-size:12px;letter-spacing:.2em;color:#f0f0f0}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#b9b9b9;font-size:14px">MAIN IMAGE（全面）</div>
    <div class="shade"></div>
    <div class="vt">ダミーのキャッチコピー</div>
    <div class="vs">ダミーテキストダミーテキストダミーテキスト</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">SCHOOL GUIDE 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
