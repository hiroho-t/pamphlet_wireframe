<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-001</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .band{position:absolute;left:0;bottom:0;width:794px;height:286px;background:#fff}
  .logo{position:absolute;left:56px;top:882px;font-size:26px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .rule{position:absolute;left:56px;top:930px;width:682px;height:1px;background:#d5d5d5}
  .cat{position:absolute;left:56px;top:958px;font-size:12px;letter-spacing:.24em;color:#8c8c8c}
  .ttl{position:absolute;left:56px;top:988px;font-size:40px;font-weight:800;line-height:1.35;letter-spacing:.04em;color:#1a1a1a}
  .yr{position:absolute;right:56px;top:988px;font-size:44px;font-weight:800;letter-spacing:.02em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:860px">MAIN IMAGE</div>
    <div class="band"></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="rule"></div>
    <div class="cat">SCHOOL GUIDE</div>
    <div class="ttl">ダミーのキャッチコピー</div>
    <div class="yr">20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
