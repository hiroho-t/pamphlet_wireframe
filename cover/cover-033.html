<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-033</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  /* 全面写真＋中央上部に明朝の大タイトル、右に学部リスト、下部に英字校名2行 */
  .ttl{position:absolute;left:0;width:794px;top:98px;text-align:center;font-size:62px;font-weight:400;letter-spacing:.34em;text-indent:.34em;color:#1a1a1a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .gb{position:absolute;left:0;width:794px;top:214px;text-align:center;font-size:10px;letter-spacing:.34em;text-indent:.34em;color:#4d4d4d}
  .yr{position:absolute;left:0;width:794px;top:234px;text-align:center;font-size:19px;letter-spacing:.24em;text-indent:.24em;color:#1a1a1a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .fac{position:absolute;left:596px;top:292px;font-size:9.5px;line-height:2.4;letter-spacing:.04em;color:#1a1a1a}
  .nm{position:absolute;left:0;width:794px;top:1010px;text-align:center;font-size:17px;line-height:1.55;letter-spacing:.28em;text-indent:.28em;color:#1a1a1a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#e0e0e0;font-size:13px">MAIN IMAGE（全面・裁ち落とし）</div>
    <div class="ttl">ダミー大学</div>
    <div class="gb">GUIDE BOOK</div>
    <div class="yr">2027</div>
    <div class="fac">ダミー学部<br>ダミー学部<br>ダミー学部<br>ダミー学部<br>ダミー学部<br>ダミー学部<br>ダミー学部</div>
    <div class="nm">DUMMY<br>UNIVERSITY</div>
    <div class="pn" style="right:20px;top:1092px">1</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
