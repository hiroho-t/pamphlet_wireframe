<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#6b6b6b}
  .cat{position:absolute;left:64px;top:88px;font-size:11px;letter-spacing:.3em;color:#e0e0e0}
  .ttl{position:absolute;left:64px;top:210px;font-size:64px;font-weight:800;line-height:1.32;letter-spacing:.04em;color:#fff}
  .lead{position:absolute;left:64px;width:400px;top:470px;font-size:13px;line-height:2.15;color:#e6e6e6}
  .logo{position:absolute;left:64px;top:1010px;font-size:20px;font-weight:800;letter-spacing:.12em;color:#fff}
  .yr{position:absolute;right:64px;top:1014px;font-size:12px;letter-spacing:.2em;color:#d5d5d5}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="cat">SCHOOL GUIDE BOOK</div>
    <div class="ttl">ダミーの<br>キャッチコピー</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:64px;top:604px;width:666px;height:352px;background:#8f8f8f;color:#e8e8e8">MAIN IMAGE</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
