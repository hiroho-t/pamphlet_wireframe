<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-013</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .card{position:absolute;left:157px;top:400px;width:480px;height:320px;background:#fff;display:grid;place-items:center;align-content:center;gap:16px}
  .card .lg{font-size:24px;font-weight:800;letter-spacing:.14em;color:#1a1a1a}
  .card .tt{font-size:26px;font-weight:800;letter-spacing:.06em;color:#1a1a1a}
  .card .ct{font-size:10px;letter-spacing:.3em;color:#8c8c8c}
  .card .yr{font-size:20px;font-weight:800;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#c4c4c4;font-size:14px">MAIN IMAGE（全面）</div>
    <div class="card"><div class="lg">SCHOOL LOGO</div><div class="tt">ダミーのキャッチ</div><div class="ct">SCHOOL GUIDE BOOK</div><div class="yr">20XX</div></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
