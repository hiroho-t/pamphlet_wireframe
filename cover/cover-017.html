<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-017</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .center{position:absolute;left:265px;top:374px;width:264px;height:375px;background:#fff;display:grid;place-items:center;align-content:center;gap:12px}
  .center .lg{font-size:20px;font-weight:800;letter-spacing:.14em;color:#1a1a1a}
  .center .ct{font-size:10px;letter-spacing:.28em;color:#8c8c8c}
  .center .yr{font-size:26px;font-weight:800;color:#1a1a1a}
  .center .tt{margin-top:8px;font-size:12px;letter-spacing:.1em;color:#4d4d4d;text-align:center;line-height:1.9}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:264px;height:374px">IMAGE 1</div>
    <div class="ph" style="left:265px;top:0;width:264px;height:374px;background:#d0d0d0">IMAGE 2</div>
    <div class="ph" style="left:530px;top:0;width:264px;height:374px">IMAGE 3</div>
    <div class="ph" style="left:0;top:375px;width:264px;height:374px;background:#d0d0d0">IMAGE 4</div>
    <div class="ph" style="left:530px;top:375px;width:264px;height:374px;background:#d0d0d0">IMAGE 5</div>
    <div class="ph" style="left:0;top:750px;width:264px;height:373px">IMAGE 6</div>
    <div class="ph" style="left:265px;top:750px;width:264px;height:373px;background:#d0d0d0">IMAGE 7</div>
    <div class="ph" style="left:530px;top:750px;width:264px;height:373px">IMAGE 8</div>
    <div class="center"><div class="lg">SCHOOL LOGO</div><div class="ct">SCHOOL GUIDE</div><div class="yr">20XX</div><div class="tt">ダミーの<br>キャッチコピー</div></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
