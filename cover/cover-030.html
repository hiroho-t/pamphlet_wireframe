<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-030</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .tx{position:absolute;left:0;top:562px;width:397px;height:561px;background:#fff;padding:56px 44px}
  .tx .ct{font-size:10px;letter-spacing:.3em;color:#8c8c8c}
  .tx .tt{margin-top:16px;font-size:34px;font-weight:800;line-height:1.45;letter-spacing:.05em;color:#1a1a1a}
  .tx .ld{margin-top:24px;font-size:12px;line-height:2.1;color:#4d4d4d}
  .tx .lg{position:absolute;left:44px;bottom:56px;font-size:18px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .tx .yr{position:absolute;right:44px;bottom:58px;font-size:11px;letter-spacing:.2em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:397px;height:561px">IMAGE 1</div>
    <div class="ph" style="left:397px;top:0;width:397px;height:561px;background:#d0d0d0">IMAGE 2</div>
    <div class="ph" style="left:397px;top:562px;width:397px;height:561px">IMAGE 3</div>
    <div class="tx"><div class="ct">SCHOOL GUIDE BOOK</div><div class="tt">ダミーの<br>キャッチコピー</div><div class="ld">ダミーテキストダミーテキストダミーテキストダミーテキスト。</div><div class="lg">SCHOOL LOGO</div><div class="yr">20XX</div></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
