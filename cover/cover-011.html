<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:180px;font-size:92px;font-weight:800;line-height:1.15;letter-spacing:.02em;color:#1a1a1a}
  .ttl{position:absolute;left:60px;top:470px;font-size:22px;font-weight:700;letter-spacing:.1em;color:#4d4d4d}
  .logo{position:absolute;left:56px;top:600px;font-size:20px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .rule{position:absolute;left:56px;top:648px;width:682px;height:1px;background:#1a1a1a}
  .yr{position:absolute;right:56px;top:596px;font-size:28px;font-weight:800;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">SCHOOL<br>GUIDE</div>
    <div class="ttl">ダミーのキャッチコピーが入ります</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">20XX</div>
    <div class="rule"></div>
    <div class="ph" style="left:56px;top:700px;width:164px;height:320px">IMAGE 1</div>
    <div class="ph" style="left:229px;top:700px;width:164px;height:320px;background:#d0d0d0">IMAGE 2</div>
    <div class="ph" style="left:402px;top:700px;width:164px;height:320px">IMAGE 3</div>
    <div class="ph" style="left:575px;top:700px;width:163px;height:320px;background:#d0d0d0">IMAGE 4</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
