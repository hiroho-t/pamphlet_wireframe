<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-005</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .center{position:absolute;left:257px;top:443px;width:280px;height:236px;background:#fff;display:grid;place-items:center;align-content:center;gap:14px}
  .center .lg{font-size:22px;font-weight:800;letter-spacing:.14em;color:#1a1a1a}
  .center .cat{font-size:10px;letter-spacing:.3em;color:#8c8c8c}
  .center .yr{font-size:30px;font-weight:800;letter-spacing:.04em;color:#1a1a1a}
  .ttl{position:absolute;left:0;width:794px;top:1058px;text-align:center;font-size:15px;font-weight:700;letter-spacing:.16em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:397px;height:511px">IMAGE 1</div>
    <div class="ph" style="left:398px;top:0;width:396px;height:511px;background:#d0d0d0">IMAGE 2</div>
    <div class="ph" style="left:0;top:512px;width:397px;height:511px;background:#d0d0d0">IMAGE 3</div>
    <div class="ph" style="left:398px;top:512px;width:396px;height:511px">IMAGE 4</div>
    <div class="center">
      <div class="lg">SCHOOL LOGO</div>
      <div class="cat">SCHOOL GUIDE</div>
      <div class="yr">20XX</div>
    </div>
    <div class="ttl">ダミーのキャッチコピーが入ります</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
