<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-021</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .col{position:absolute;top:800px;width:213px;font-size:12px;line-height:2;color:#4d4d4d}
  .col b{display:block;margin-bottom:8px;font-size:14px;font-weight:800;color:#1a1a1a}
  .logo{position:absolute;left:56px;top:1010px;font-size:18px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .yr{position:absolute;right:56px;top:1014px;font-size:11px;letter-spacing:.2em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:740px;font-size:14px">MAIN IMAGE</div>
    <div class="col" style="left:56px"><b>ダミーの見出し</b>ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="col" style="left:290px"><b>ダミーの見出し</b>ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="col" style="left:524px"><b>ダミーの見出し</b>ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">SCHOOL GUIDE 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
