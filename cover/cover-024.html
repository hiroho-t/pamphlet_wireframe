<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-024</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .vt{position:absolute;right:70px;top:110px;height:620px;writing-mode:vertical-rl;font-size:42px;font-weight:800;line-height:1.6;letter-spacing:.18em;color:#1a1a1a}
  .band{position:absolute;left:0;top:840px;width:794px;height:110px;background:#6b6b6b;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
  .band .lg{font-size:18px;font-weight:800;letter-spacing:.12em;color:#fff}
  .band .yr{font-size:12px;letter-spacing:.2em;color:#e0e0e0}
  .lead{position:absolute;left:56px;width:400px;top:990px;font-size:12px;line-height:2.05;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:56px;top:110px;width:440px;height:660px">MAIN IMAGE</div>
    <div class="vt">ダミーのキャッチコピー</div>
    <div class="band"><div class="lg">SCHOOL LOGO</div><div class="yr">SCHOOL GUIDE 20XX</div></div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
