<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .vt{position:absolute;left:80px;top:120px;height:760px;writing-mode:vertical-rl;font-size:46px;font-weight:800;line-height:1.55;letter-spacing:.18em;color:#1a1a1a}
  .vs{position:absolute;left:190px;top:120px;height:400px;writing-mode:vertical-rl;font-size:13px;line-height:2.2;letter-spacing:.1em;color:#8c8c8c}
  .logo{position:absolute;left:80px;top:960px;font-size:19px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .yr{position:absolute;left:80px;top:1000px;font-size:11px;letter-spacing:.24em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:294px;top:0;width:500px;height:1123px">MAIN IMAGE</div>
    <div class="vt">ダミーのキャッチコピー</div>
    <div class="vs">SCHOOL GUIDE BOOK 20XX</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="yr">GUIDE BOOK 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
