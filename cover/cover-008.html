<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-008</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .side{position:absolute;left:0;top:0;width:132px;height:1123px;background:#6b6b6b}
  .side .lg{position:absolute;left:24px;top:64px;font-size:15px;font-weight:800;line-height:1.6;letter-spacing:.12em;color:#fff}
  .side .yr{position:absolute;left:38px;top:860px;writing-mode:vertical-rl;font-size:12px;letter-spacing:.3em;color:#e0e0e0}
  .cat{position:absolute;left:180px;top:704px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .ttl{position:absolute;left:180px;top:740px;font-size:42px;font-weight:800;line-height:1.4;letter-spacing:.04em;color:#1a1a1a}
  .lead{position:absolute;left:180px;width:480px;top:892px;font-size:13px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:132px;top:0;width:662px;height:660px">MAIN IMAGE</div>
    <div class="side"><div class="lg">SCHOOL<br>LOGO</div><div class="yr">SCHOOL GUIDE 20XX</div></div>
    <div class="cat">SCHOOL GUIDE 20XX</div>
    <div class="ttl">ダミーのキャッチ<br>コピーが入ります</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
