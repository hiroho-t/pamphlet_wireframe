<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-037</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  /* 表紙：全面写真の左上に英字ロゴタイプ＋校名＋分野リストを重ね、右下に円形バッジを置く */
  .en{position:absolute;left:75px;top:86px;font-size:20px;font-weight:800;font-style:italic;letter-spacing:.02em;color:#1a1a1a}
  .nm{position:absolute;left:75px;top:130px;font-size:46px;font-weight:800;letter-spacing:.04em;color:#1a1a1a}
  .fl{position:absolute;left:75px;top:214px;font-size:17px;font-weight:700;line-height:1.75;letter-spacing:.02em;color:#1a1a1a}
  .bdg{position:absolute;left:614px;top:945px;width:115px;height:115px;border-radius:50%;background:#4d4d4d;display:grid;place-items:center;align-content:center;gap:2px;text-align:center;font-size:9px;letter-spacing:.14em;color:#fff}
  .bdg b{font-size:14px}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#c9c9c9;font-size:14px">MAIN IMAGE（全面）</div>
    <div class="en">Dummy College of Technology</div>
    <div class="nm">ダミー工学校</div>
    <div class="fl">ダミー・ダミー／ダミー・ダミー<br>ダミー・ダミー<br>ダミー・ダミー<br>ダミー・ダミー</div>
    <div class="bdg">SCHOOL<br>GUIDE<br><b>20XX</b></div>
    <div class="pn" style="right:20px;top:1092px">1</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
