<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:660px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:688px;font-size:30px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .col{position:absolute;top:760px;width:329px}
  .col ul{list-style:none}
  .col li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid #d5d5d5;font-size:13px;font-weight:700;color:#1a1a1a}
  .col li:last-child{border-bottom:1px solid #d5d5d5}
  .col li span{font-size:12px;font-weight:400;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:600px">MAIN IMAGE</div>
    <div class="eye">CONTENTS</div>
    <div class="h1">目次</div>
    <div class="col" style="left:56px"><ul>
      <li>ダミーの見出しテキスト<span>04</span></li>
      <li>ダミーの見出しテキスト<span>08</span></li>
      <li>ダミーの見出しテキスト<span>14</span></li>
      <li>ダミーの見出しテキスト<span>20</span></li>
    </ul></div>
    <div class="col" style="left:409px"><ul>
      <li>ダミーの見出しテキスト<span>26</span></li>
      <li>ダミーの見出しテキスト<span>32</span></li>
      <li>ダミーの見出しテキスト<span>38</span></li>
      <li>ダミーの見出しテキスト<span>44</span></li>
    </ul></div>
    <div class="pn" style="left:56px;top:1064px">02</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
