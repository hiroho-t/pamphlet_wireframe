<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>admission-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .tb{position:absolute;left:56px;width:682px;border-collapse:collapse;font-size:11px}
  .tb th{background:#f0f0f0;padding:11px 10px;text-align:left;font-size:10.5px;font-weight:700;color:#1a1a1a;border-bottom:1px solid #d5d5d5}
  .tb td{padding:12px 10px;border-bottom:1px solid #e6e6e6;color:#4d4d4d;line-height:1.7}
  .tb td.n{font-weight:700;color:#1a1a1a}
  .nt{position:absolute;left:56px;width:682px;font-size:10.5px;line-height:1.9;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">FEE &amp; VENUE</div>
    <div class="h1">検定料と試験場</div>

      <tr><td class="n">ダミー入試</td><td>35,000円</td><td>15,000円</td></tr>
      <tr><td class="n">ダミー入試</td><td>35,000円</td><td>15,000円</td></tr>
      <tr><td class="n">ダミー入試（共通テスト利用）</td><td>18,000円</td><td>10,000円</td></tr>
    </tbody></table>
    <div class="nt" style="top:360px">※納入された検定料は返還いたしません。</div>
    <table class="tb" style="top:410px"><thead><tr><th style="width:150px">試験場</th><th style="width:250px">所在地</th><th>実施入試</th></tr></thead><tbody>
      <tr><td class="n">本学</td><td>ダミー県ダミー市ダミー町0-0-0</td><td>全入試</td></tr>
      <tr><td class="n">ダミー会場</td><td>ダミー県ダミー市ダミー町0-0-0</td><td>ダミー入試</td></tr>
      <tr><td class="n">ダミー会場</td><td>ダミー県ダミー市ダミー町0-0-0</td><td>ダミー入試</td></tr>
      <tr><td class="n">ダミー会場</td><td>ダミー県ダミー市ダミー町0-0-0</td><td>ダミー入試</td></tr>
    </tbody></table>
    <div class="nt" style="top:640px">※試験場は出願時に選択してください。</div>
    <div class="ph" style="left:56px;top:690px;width:333px;height:330px;font-size:12px">MAP</div>
    <div class="ph" style="left:405px;top:690px;width:333px;height:330px">IMAGE</div>
    <div class="pn" style="right:56px;top:1064px">70</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
