<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>admission-012</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .st{position:absolute;width:213px;height:140px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:6px}
  .st .l{font-size:10.5px;color:#8c8c8c}
  .st .v{font-size:32px;font-weight:800;line-height:1;color:#1a1a1a}
  .st .v small{font-size:13px}
  .tb{position:absolute;left:56px;width:682px;border-collapse:collapse;font-size:11px}
  .tb th{background:#6b6b6b;color:#fff;padding:10px 8px;font-size:10.5px;font-weight:700;border:1px solid #6b6b6b}
  .tb td{padding:12px 8px;border:1px solid #e6e6e6;color:#4d4d4d;text-align:center;line-height:1.65}
  .tb td.n{text-align:left;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">ADMISSION DATA</div>
    <div class="h1">入試データ（過去3年）</div>
    <div class="st" style="left:56px;top:180px"><div class="l">志願者数</div><div class="v">3,200<small>名</small></div></div>
    <div class="st" style="left:290px;top:180px"><div class="l">合格者数</div><div class="v">760<small>名</small></div></div>
    <div class="st" style="left:524px;top:180px"><div class="l">実質倍率</div><div class="v">4.2<small>倍</small></div></div>
    <table class="tb" style="top:350px"><thead><tr><th style="width:140px">年度</th><th>志願者数</th><th>受験者数</th><th>合格者数</th><th>倍率</th></tr></thead><tbody>
      <tr><td class="n">20XX年度</td><td>2,880名</td><td>2,760名</td><td>740名</td><td>3.7倍</td></tr>
      <tr><td class="n">20XX年度</td><td>3,040名</td><td>2,910名</td><td>750名</td><td>3.9倍</td></tr>
      <tr><td class="n">20XX年度</td><td>3,200名</td><td>3,050名</td><td>760名</td><td>4.2倍</td></tr>
    </tbody></table>
    <div class="ph" style="left:56px;top:530px;width:682px;height:280px;font-size:12px">GRAPH（志願者数推移）</div>
    <div class="ph" style="left:56px;top:840px;width:682px;height:180px">IMAGE</div>
    <div class="pn" style="right:56px;top:1064px">68</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
