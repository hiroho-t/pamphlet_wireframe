<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencampus-003</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:660px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:686px;font-size:28px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .tl{position:absolute;left:56px;top:760px;width:400px}
  .tl .r{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid #e6e6e6}
  .tl .r .t{flex:none;width:96px;font-size:11.5px;font-weight:800;color:#1a1a1a}
  .tl .r .x{font-size:11.5px;color:#4d4d4d}
  .bx{position:absolute;left:490px;top:760px;width:248px;border:1px solid #d5d5d5;padding:20px}
  .bx .t{font-size:11px;letter-spacing:.14em;color:#8c8c8c;padding-bottom:9px;border-bottom:1px solid #d5d5d5}
  .bx dt{font-size:10px;color:#8c8c8c;margin-top:12px}
  .bx dd{margin-top:3px;font-size:12px;font-weight:700;line-height:1.6;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:400px;font-size:13px">MAIN IMAGE</div>
    <div class="ph" style="left:0;top:400px;width:264px;height:220px">IMAGE</div>
    <div class="ph" style="left:265px;top:400px;width:264px;height:220px">IMAGE</div>
    <div class="ph" style="left:530px;top:400px;width:264px;height:220px">IMAGE</div>
    <div class="en">OPEN CAMPUS</div>
    <div class="h1">当日のタイムテーブル</div>
    <div class="tl">
      <div class="r"><div class="t">10:00</div><div class="x">ダミーのプログラム名</div></div>
      <div class="r"><div class="t">10:30</div><div class="x">ダミーのプログラム名</div></div>
      <div class="r"><div class="t">11:30</div><div class="x">ダミーのプログラム名</div></div>
      <div class="r"><div class="t">12:30</div><div class="x">ダミーのプログラム名</div></div>
      <div class="r"><div class="t">13:30</div><div class="x">ダミーのプログラム名</div></div>
      <div class="r"><div class="t">15:00</div><div class="x">ダミーのプログラム名</div></div>
    </div>
    <dl class="bx"><div class="t">INFORMATION</div><dt>開催日</dt><dd>X月X日（土）</dd><dt>受付時間</dt><dd>9:30〜</dd><dt>会場</dt><dd>ダミーキャンパス</dd><dt>申込</dt><dd>Webから事前予約</dd></dl>
    <div class="pn" style="left:56px;top:1060px">72</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
