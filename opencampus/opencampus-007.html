<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencampus-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .dt{position:absolute;left:56px;width:682px}
  .dt .r{display:flex;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid #e6e6e6}
  .dt .r .d{flex:none;width:170px;font-size:19px;font-weight:800;color:#1a1a1a}
  .dt .r .d span{font-size:11px;font-weight:400;color:#8c8c8c;margin-left:6px}
  .dt .r .t{flex:none;width:120px;font-size:11.5px;color:#4d4d4d}
  .dt .r .p{flex:1;font-size:11.5px;color:#4d4d4d}
  .dt .r .g{flex:none;padding:5px 11px;border:1px solid #d5d5d5;font-size:10px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">OPEN CAMPUS 20XX</div>
    <div class="h1">開催日程一覧</div>
    <div class="dt" style="top:180px">
      <div class="r"><div class="d">X月X日<span>（土）</span></div><div class="t">10:00〜15:00</div><div class="p">ダミーキャンパス／ダミーのプログラム</div><div class="g">要予約</div></div>
      <div class="r"><div class="d">X月X日<span>（日）</span></div><div class="t">10:00〜15:00</div><div class="p">ダミーキャンパス／ダミーのプログラム</div><div class="g">要予約</div></div>
      <div class="r"><div class="d">X月X日<span>（土）</span></div><div class="t">13:00〜16:00</div><div class="p">オンライン／ダミーのプログラム</div><div class="g">要予約</div></div>
      <div class="r"><div class="d">X月X日<span>（日）</span></div><div class="t">10:00〜15:00</div><div class="p">ダミーキャンパス／ダミーのプログラム</div><div class="g">予約不要</div></div>
      <div class="r"><div class="d">X月X日<span>（土）</span></div><div class="t">10:00〜15:00</div><div class="p">ダミーキャンパス／ダミーのプログラム</div><div class="g">要予約</div></div>
      <div class="r"><div class="d">X月X日<span>（日）</span></div><div class="t">10:00〜15:00</div><div class="p">ダミーキャンパス／ダミーのプログラム</div><div class="g">要予約</div></div>
    </div>
    <div class="ph" style="left:56px;top:640px;width:682px;height:250px">IMAGE</div>
    <div class="ph" style="left:56px;top:910px;width:110px;height:110px">QR</div>
    <div class="pn" style="right:56px;top:1064px">72</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
