<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencampus-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#6b6b6b}
  .eye{position:absolute;left:0;width:794px;top:120px;text-align:center;font-size:11px;letter-spacing:.3em;color:#e0e0e0}
  .h1{position:absolute;left:0;width:794px;top:160px;text-align:center;font-size:46px;font-weight:800;line-height:1.4;letter-spacing:.06em;color:#fff}
  .lead{position:absolute;left:177px;width:440px;top:330px;text-align:center;font-size:12.5px;line-height:2.15;color:#e6e6e6}
  .dt{position:absolute;left:0;width:794px;top:440px;display:flex;justify-content:center;gap:14px}
  .dt span{padding:12px 20px;border:1px solid #fff;font-size:14px;font-weight:700;color:#fff}
  .info{position:absolute;left:56px;top:820px;width:682px;background:#fff;padding:24px 28px;display:flex;gap:26px;align-items:center}
  .info .q{flex:none;width:110px;height:110px;background:#dcdcdc;display:grid;place-items:center;font-size:10px;color:#8c8c8c}
  .info .x{font-size:11.5px;line-height:2;color:#4d4d4d}
  .info .x b{display:block;font-size:15px;font-weight:800;color:#1a1a1a;margin-bottom:6px}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="eye">OPEN CAMPUS 20XX</div>
    <div class="h1">オープンキャンパス<br>開催のお知らせ</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="dt"><span>X/X（土）</span><span>X/X（日）</span><span>X/X（土）</span></div>
    <div class="ph" style="left:56px;top:540px;width:682px;height:240px;background:#8f8f8f;color:#e8e8e8">IMAGE</div>
    <div class="info"><div class="q">QR</div><div class="x"><b>お申し込みはこちら</b>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト<br>TEL 000-000-0000／https://dummy.example.ac.jp/</div></div>
    <div class="pn" style="right:56px;top:1064px;color:#d5d5d5">72</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
