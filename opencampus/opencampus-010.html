<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencampus-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .mp{position:absolute;left:56px;top:180px;width:682px;height:400px;background:#dcdcdc;display:grid;place-items:center;font-size:13px;letter-spacing:.2em;color:#8c8c8c}
  .lg{position:absolute;left:56px;top:610px;width:682px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px}
  .lg .r{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #ececec}
  .lg .r .n{flex:none;width:24px;height:24px;background:#1a1a1a;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
  .lg .r .t{font-size:11.5px;color:#1a1a1a}
  .lg .r .x{margin-left:auto;font-size:10px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">VENUE MAP</div>
    <div class="h1">当日の会場案内</div>
    <div class="mp">CAMPUS MAP（当日会場）</div>
    <div class="lg">
      <div class="r"><div class="n">1</div><div class="t">総合受付</div><div class="x">X号館 1F</div></div>
      <div class="r"><div class="n">2</div><div class="t">全体説明会</div><div class="x">X号館 大講義室</div></div>
      <div class="r"><div class="n">3</div><div class="t">学科紹介ブース</div><div class="x">X号館 2F</div></div>
      <div class="r"><div class="n">4</div><div class="t">体験授業</div><div class="x">X号館 3F</div></div>
      <div class="r"><div class="n">5</div><div class="t">個別相談</div><div class="x">X号館 1F</div></div>
      <div class="r"><div class="n">6</div><div class="t">学食体験</div><div class="x">学生食堂</div></div>
      <div class="r"><div class="n">7</div><div class="t">キャンパスツアー</div><div class="x">受付集合</div></div>
      <div class="r"><div class="n">8</div><div class="t">休憩スペース</div><div class="x">X号館 1F</div></div>
    </div>
    <div class="ph" style="left:56px;top:880px;width:682px;height:140px">IMAGE</div>
    <div class="pn" style="left:56px;top:1064px">72</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
