<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>global-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .mp{position:absolute;left:56px;top:180px;width:682px;height:380px;background:#dcdcdc;display:grid;place-items:center;font-size:13px;letter-spacing:.2em;color:#8c8c8c}
  .tb{position:absolute;left:56px;top:600px;width:682px;border-collapse:collapse;font-size:11px}
  .tb th{background:#6b6b6b;color:#fff;padding:10px 10px;text-align:left;font-size:10.5px;font-weight:700}
  .tb td{padding:11px 10px;border-bottom:1px solid #e6e6e6;color:#4d4d4d;line-height:1.7}
  .tb td.n{font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">PARTNER SCHOOLS</div>
    <div class="h1">海外協定校</div>
    <div class="mp">WORLD MAP</div>
    <table class="tb"><thead><tr><th style="width:110px">国・地域</th><th style="width:230px">大学名</th><th style="width:120px">協定種別</th><th>派遣実績</th></tr></thead><tbody>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>交換留学</td><td>年間 00名</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>交換留学</td><td>年間 00名</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>語学研修</td><td>年間 00名</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>短期研修</td><td>年間 00名</td></tr>
      <tr><td class="n">ダミー国</td><td>ダミー大学</td><td>学術交流</td><td>—</td></tr>
    </tbody></table>
    <div class="ph" style="left:56px;top:880px;width:682px;height:140px">IMAGE</div>
    <div class="pn" style="right:56px;top:1064px">36</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
