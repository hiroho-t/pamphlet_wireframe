<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>global-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .tab{position:absolute;left:0;top:0;width:173px;height:164px;background:#4d4d4d;color:#fff;
    display:grid;place-items:center;text-align:center;font-size:19px;font-weight:700;line-height:1.7;letter-spacing:.1em}
  .tab::after{content:"";position:absolute;right:0;bottom:0;border-width:0 0 22px 22px;
    border-style:solid;border-color:transparent transparent #fff transparent}
  .cap{position:absolute;left:69px;top:1005px;width:232px;background:rgba(255,255,255,.9);padding:8px 10px}
  .cap i{display:inline-block;width:18px;height:12px;background:#8c8c8c;vertical-align:middle;margin-right:6px}
  .cap b{font-size:9px;color:#4d4d4d;font-weight:400}
  .cap strong{display:block;font-size:13px;font-weight:700;color:#1a1a1a;margin-top:4px}
  .cap span{display:block;font-size:7px;line-height:1.6;color:#6b6b6b;margin-top:3px}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:53px;top:0;width:741px;height:1123px">PHOTO（全面）</div>
    <div class="tab">留学の<br>DUMMY</div>
    <div class="cap">
      <i></i><b>ダミー州立大学　ダミー学専攻</b>
      <strong>ダミー 仁美さん</strong>
      <span>ダミーのダミーからダミーへ。ダミーのダミーを活かして学んでいます。</span>
    </div>
    <div class="pn" style="left:30px;top:1088px;color:#fff">30</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
