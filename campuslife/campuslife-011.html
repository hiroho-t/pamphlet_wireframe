<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>campuslife-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .st{position:absolute;width:213px;height:140px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:6px}
  .st .l{font-size:10.5px;color:#8c8c8c}
  .st .v{font-size:34px;font-weight:800;line-height:1;color:#1a1a1a}
  .st .v small{font-size:13px}
  .bd{position:absolute;left:56px;width:682px;top:500px;font-size:12px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CAMPUS LIFE DATA</div>
    <div class="h1">数字で見る学生生活</div>
    <div class="st" style="left:56px;top:180px"><div class="l">サークル数</div><div class="v">100<small>団体</small></div></div>
    <div class="st" style="left:290px;top:180px"><div class="l">加入率</div><div class="v">72<small>%</small></div></div>
    <div class="st" style="left:524px;top:180px"><div class="l">年間行事</div><div class="v">32<small>件</small></div></div>
    <div class="st" style="left:56px;top:340px"><div class="l">アルバイト率</div><div class="v">68<small>%</small></div></div>
    <div class="st" style="left:290px;top:340px"><div class="l">一人暮らし率</div><div class="v">45<small>%</small></div></div>
    <div class="st" style="left:524px;top:340px"><div class="l">通学時間 平均</div><div class="v">42<small>分</small></div></div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:600px;width:682px;height:250px">IMAGE</div>
    <div class="ph" style="left:56px;top:870px;width:333px;height:150px">IMAGE</div>
    <div class="ph" style="left:405px;top:870px;width:333px;height:150px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">40</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
