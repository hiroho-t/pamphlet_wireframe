<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>campuslife-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:0;width:794px;top:76px;text-align:center;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:0;width:794px;top:102px;text-align:center;font-size:30px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .cap{position:absolute;font-size:10.5px;line-height:1.7;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">SNAPSHOTS</div>
    <div class="h1">キャンパスの日常</div>
    <div class="ph" style="left:56px;top:180px;width:440px;height:280px">IMAGE</div>
    <div class="ph" style="left:512px;top:180px;width:226px;height:135px">IMAGE</div>
    <div class="ph" style="left:512px;top:325px;width:226px;height:135px">IMAGE</div>
    <div class="cap" style="left:56px;top:470px;width:440px">ダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:520px;width:226px;height:170px">IMAGE</div>
    <div class="ph" style="left:298px;top:520px;width:198px;height:170px">IMAGE</div>
    <div class="ph" style="left:512px;top:520px;width:226px;height:170px">IMAGE</div>
    <div class="ph" style="left:56px;top:706px;width:198px;height:150px">IMAGE</div>
    <div class="ph" style="left:270px;top:706px;width:226px;height:150px">IMAGE</div>
    <div class="ph" style="left:512px;top:706px;width:226px;height:150px">IMAGE</div>
    <div class="ph" style="left:56px;top:872px;width:682px;height:150px">IMAGE</div>
    <div class="pn" style="left:0;width:794px;text-align:center;top:1060px">40</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
