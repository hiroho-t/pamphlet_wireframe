<!DOCTYPE html>

<head>

<title>campuslife-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .bd{position:absolute;left:56px;width:400px;top:730px;font-size:12px;line-height:2.15;color:#4d4d4d}
  .box{position:absolute;left:490px;top:730px;width:248px;border:1px solid #d5d5d5;padding:18px 20px}
  .box .t{font-size:10.5px;letter-spacing:.14em;color:#8c8c8c;padding-bottom:9px;border-bottom:1px solid #d5d5d5}
  .box li{list-style:none;padding:8px 0;border-bottom:1px solid #e6e6e6;font-size:11.5px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">

<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
