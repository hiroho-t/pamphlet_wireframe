<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>campuslife-020</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .cap{position:absolute;font-size:10.5px;line-height:1.75;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">A YEAR IN PHOTOS</div>
    <div class="h1">写真で見る1年</div>
    <div class="ph" style="left:56px;top:180px;width:222px;height:170px">4月</div>
    <div class="ph" style="left:286px;top:180px;width:222px;height:170px">5月</div>
    <div class="ph" style="left:516px;top:180px;width:222px;height:170px">6月</div>
    <div class="ph" style="left:56px;top:360px;width:222px;height:170px">7月</div>
    <div class="ph" style="left:286px;top:360px;width:222px;height:170px">8月</div>
    <div class="ph" style="left:516px;top:360px;width:222px;height:170px">9月</div>
    <div class="ph" style="left:56px;top:540px;width:222px;height:170px">10月</div>
    <div class="ph" style="left:286px;top:540px;width:222px;height:170px">11月</div>
    <div class="ph" style="left:516px;top:540px;width:222px;height:170px">12月</div>
    <div class="ph" style="left:56px;top:720px;width:222px;height:170px">1月</div>
    <div class="ph" style="left:286px;top:720px;width:222px;height:170px">2月</div>
    <div class="ph" style="left:516px;top:720px;width:222px;height:170px">3月</div>
    <div class="cap" style="left:56px;top:910px;width:682px">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="pn" style="right:56px;top:1060px">38</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
