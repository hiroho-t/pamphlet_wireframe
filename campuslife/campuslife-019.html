<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>campuslife-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .g{position:absolute;left:56px;top:180px;width:682px;height:260px;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .t{position:absolute;left:56px;width:682px;font-size:12px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:9px;border-bottom:1px solid #1a1a1a}
  .r{position:absolute;left:56px;width:682px;display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid #ececec}
  .r .n{flex:none;width:180px;font-size:11.5px;color:#1a1a1a}
  .r .b{flex:1;height:15px;background:#f0f0f0;position:relative}
  .r .b i{position:absolute;left:0;top:0;height:15px;background:#6b6b6b}
  .r .v{flex:none;width:56px;text-align:right;font-size:11px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">SURVEY</div>
    <div class="h1">学生生活アンケート</div>
    <div class="g">GRAPH（アンケート結果）</div>
    <div class="t" style="top:490px">1週間の過ごし方</div>
    <div class="r" style="top:540px"><div class="n">ダミーの項目</div><div class="b"><i style="width:80%"></i></div><div class="v">28h</div></div>
    <div class="r" style="top:590px"><div class="n">ダミーの項目</div><div class="b"><i style="width:60%"></i></div><div class="v">21h</div></div>
    <div class="r" style="top:640px"><div class="n">ダミーの項目</div><div class="b"><i style="width:45%"></i></div><div class="v">16h</div></div>
    <div class="r" style="top:690px"><div class="n">ダミーの項目</div><div class="b"><i style="width:30%"></i></div><div class="v">11h</div></div>
    <div class="r" style="top:740px"><div class="n">ダミーの項目</div><div class="b"><i style="width:18%"></i></div><div class="v">6h</div></div>
    <div class="ph" style="left:56px;top:810px;width:682px;height:210px">IMAGE</div>
    <div class="pn" style="left:56px;top:1060px">40</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
