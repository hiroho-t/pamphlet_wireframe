<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>facility-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:30px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .mp{position:absolute;left:56px;top:180px;width:682px;height:440px;background:#dcdcdc;display:grid;place-items:center;font-size:13px;letter-spacing:.2em;color:#8c8c8c}
  .lg{position:absolute;left:56px;top:650px;width:682px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 40px}
  .lg .r{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid #e6e6e6}
  .lg .r .n{flex:none;width:26px;height:26px;border:1px solid #1a1a1a;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1a1a1a}
  .lg .r .t{font-size:12px;font-weight:700;color:#1a1a1a}
  .lg .r .x{font-size:10.5px;color:#8c8c8c;margin-left:auto}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">CAMPUS MAP</div>
    <div class="h1">キャンパスマップ</div>
    <div class="mp">CAMPUS MAP</div>
    <div class="lg">
      <div class="r"><div class="n">1</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">2</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">3</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">4</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">5</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">6</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">7</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
      <div class="r"><div class="n">8</div><div class="t">ダミーの建物名</div><div class="x">ダミー</div></div>
    </div>
    <div class="ph" style="left:56px;top:900px;width:333px;height:120px">IMAGE</div>
    <div class="ph" style="left:405px;top:900px;width:333px;height:120px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">44</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
