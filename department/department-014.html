<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>department-014</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}

  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}

  .tb{position:absolute;left:56px;top:190px;width:682px;border-collapse:collapse;font-size:11.5px}
  .tb th{background:#6b6b6b;color:#fff;padding:12px 10px;font-size:11px;font-weight:700;border:1px solid #6b6b6b}
  .tb td{padding:14px 12px;border:1px solid #e6e6e6;color:#4d4d4d;vertical-align:top;line-height:1.85}
  .tb td.n{background:#fafafa;font-weight:700;color:#1a1a1a;width:130px}

</head>
<body>

      <tr><td class="n">主な科目</td><td>ダミー科目／ダミー科目</td><td>ダミー科目／ダミー科目</td><td>ダミー科目／ダミー科目</td></tr>

    <div class="ph" style="left:56px;top:640px;width:222px;height:180px">IMAGE</div>
    <div class="ph" style="left:286px;top:640px;width:222px;height:180px">IMAGE</div>
    <div class="ph" style="left:516px;top:640px;width:222px;height:180px">IMAGE</div>
    <div class="ph" style="left:56px;top:840px;width:682px;height:180px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">10</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
