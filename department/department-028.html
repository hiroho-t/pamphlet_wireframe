<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>department-028</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .mp{position:absolute;left:56px;top:180px;width:682px}
  .mp .hd{display:grid;grid-template-columns:110px repeat(4,1fr);background:#6b6b6b;color:#fff;font-size:11px;font-weight:700}
  .mp .hd div{padding:10px;text-align:center}
  .mp .rw{display:grid;grid-template-columns:110px repeat(4,1fr);border-bottom:1px solid #e6e6e6}
  .mp .rw .lb{padding:14px 10px;background:#fafafa;font-size:11px;font-weight:700;color:#1a1a1a;display:flex;align-items:center}
  .mp .rw .cl{padding:10px 8px;font-size:10.5px;line-height:1.75;color:#4d4d4d;border-left:1px solid #ececec}
  .mp .rw .cl.on{background:#f0f0f0;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CURRICULUM MAP</div>
    <div class="h1">ダミー学科のカリキュラムマップ</div>
    <div class="mp">
      <div class="hd"><div></div><div>1年次</div><div>2年次</div><div>3年次</div><div>4年次</div></div>
      <div class="rw"><div class="lb">教養科目</div><div class="cl on">ダミー科目<br>ダミー科目</div><div class="cl on">ダミー科目</div><div class="cl"></div><div class="cl"></div></div>
      <div class="rw"><div class="lb">専門基礎</div><div class="cl on">ダミー科目</div><div class="cl on">ダミー科目<br>ダミー科目</div><div class="cl">ダミー科目</div><div class="cl"></div></div>
      <div class="rw"><div class="lb">専門科目</div><div class="cl"></div><div class="cl on">ダミー科目</div><div class="cl on">ダミー科目<br>ダミー科目</div><div class="cl on">ダミー科目</div></div>
      <div class="rw"><div class="lb">実習・演習</div><div class="cl">ダミー実習</div><div class="cl on">ダミー実習</div><div class="cl on">ダミー実習</div><div class="cl on">ダミー実習</div></div>
      <div class="rw"><div class="lb">卒業研究</div><div class="cl"></div><div class="cl"></div><div class="cl">ゼミ配属</div><div class="cl on">卒業研究</div></div>
      <div class="rw"><div class="lb">キャリア</div><div class="cl">ガイダンス</div><div class="cl">ガイダンス</div><div class="cl on">インターン</div><div class="cl on">就職支援</div></div>
    </div>
    <div class="ph" style="left:56px;top:700px;width:682px;height:320px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">16</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
