<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>department-016</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .band{position:absolute;left:0;top:0;width:794px;height:220px;background:#f0f0f0}
  .eye{position:absolute;left:56px;top:60px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .vt{position:absolute;left:56px;top:88px;font-size:36px;font-weight:800;letter-spacing:.2em;color:#1a1a1a}
  .cp{position:absolute;left:56px;top:150px;font-size:13px;letter-spacing:.08em;color:#4d4d4d}
  .box{position:absolute;left:56px;top:840px;width:340px;background:#fff;border:1px solid #d5d5d5;padding:18px 20px}
  .box .t{font-size:11px;letter-spacing:.14em;color:#8c8c8c;padding-bottom:8px;border-bottom:1px solid #d5d5d5}
  .box li{list-style:none;padding:7px 0;border-bottom:1px solid #ececec;font-size:11px;color:#4d4d4d}
  .bd{position:absolute;left:430px;width:308px;top:840px;font-size:11.5px;line-height:2.05;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="band"></div>
    <div class="eye">DEPARTMENT OF DUMMY</div>
    <div class="vt">ダミー学科</div>
    <div class="cp">ダミーのキャッチコピーがここに入ります</div>
    <div class="ph" style="left:0;top:220px;width:794px;height:580px;font-size:13px">MAIN IMAGE</div>
    <div class="box"><div class="t">取得できる資格</div><ul><li>ダミーの資格名</li><li>ダミーの資格名</li><li>ダミーの資格名</li><li>ダミーの資格名</li></ul></div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="pn" style="left:56px;top:1064px">14</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
