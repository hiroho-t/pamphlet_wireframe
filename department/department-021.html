<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>department-021</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:30px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .h1{position:absolute;left:56px;top:96px;font-size:28px;font-weight:800;letter-spacing:.06em;color:#1a1a1a}
  .col{position:absolute;top:180px;width:329px}
  .col .t{font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
  .col li{list-style:none;padding:10px 0;border-bottom:1px solid #ececec;font-size:11.5px;color:#4d4d4d}
  .col li b{display:block;font-size:12px;color:#1a1a1a}
  .st{position:absolute;top:560px;width:159px;height:120px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:6px}
  .st .l{font-size:10.5px;color:#8c8c8c}
  .st .v{font-size:28px;font-weight:800;line-height:1;color:#1a1a1a}
  .st .v small{font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">LICENSE &amp; CAREER</div>
    <div class="h1">ダミー学科の資格と進路</div>

    <div class="st" style="left:56px"><div class="l">就職率</div><div class="v">98.5<small>%</small></div></div>
    <div class="st" style="left:230px"><div class="l">資格合格率</div><div class="v">92<small>%</small></div></div>

    <div class="ph" style="left:56px;top:720px;width:682px;height:300px">IMAGE</div>
    <div class="pn" style="left:56px;top:1060px">18</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
