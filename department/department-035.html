<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>department-035</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .band{position:absolute;left:0;top:700px;width:794px;height:423px;background:#fff}
  .eye{position:absolute;left:56px;top:740px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:766px;font-size:34px;font-weight:800;letter-spacing:.06em;color:#1a1a1a}
  .cp{position:absolute;left:56px;top:826px;font-size:16px;font-weight:700;color:#4d4d4d}
  .bd{position:absolute;left:56px;width:400px;top:872px;font-size:11.5px;line-height:2.05;color:#4d4d4d}
  .dl{position:absolute;right:56px;top:872px;width:240px}
  .dl div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e6e6e6;font-size:11px;color:#4d4d4d}
  .dl div b{color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:700px;font-size:14px">MAIN IMAGE</div>
    <div class="band"></div>
    <div class="eye">DEPARTMENT OF DUMMY</div>
    <div class="h1">ダミー学科</div>
    <div class="cp">ダミーのキャッチコピーが入ります</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="dl"><div><b>定員</b>120名</div><div><b>修業年限</b>4年</div><div><b>取得学位</b>ダミー学士</div><div><b>キャンパス</b>ダミー</div></div>
    <div class="pn" style="left:56px;top:1064px">12</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
