<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>department-003</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:432px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:432px;top:122px;font-size:30px;font-weight:800;line-height:1.45;letter-spacing:.08em;color:#1a1a1a}
  .bd{position:absolute;left:432px;width:306px;top:230px;font-size:12px;line-height:2.15;color:#4d4d4d}
  .lst{position:absolute;left:432px;width:306px;top:430px}
  .lst .t{font-size:11px;letter-spacing:.16em;color:#8c8c8c;padding-bottom:8px;border-bottom:1px solid #1a1a1a}
  .lst li{list-style:none;padding:10px 0;border-bottom:1px solid #e6e6e6;font-size:12px;color:#1a1a1a}
  .bot{position:absolute;left:56px;top:800px;width:682px}
  .bot .t{font-size:13px;font-weight:800;letter-spacing:.08em;color:#1a1a1a;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
  .bot .g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
  .bot .im{width:100%;height:110px;background:#dcdcdc;display:grid;place-items:center;font-size:10px;letter-spacing:.16em;color:#8c8c8c}
  .bot .n{margin-top:8px;font-size:11.5px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:376px;height:740px">MAIN IMAGE</div>
    <div class="en">DEPARTMENT OF DUMMY</div>
    <div class="h1">ダミー学科<br>ダミーコース</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="lst"><div class="t">主な専門科目</div><ul>
      <li>ダミーの科目名</li><li>ダミーの科目名</li><li>ダミーの科目名</li><li>ダミーの科目名</li><li>ダミーの科目名</li>
    </ul></div>
    <div class="bot"><div class="t">実習・演習の風景</div><div class="g">
      <div><div class="im">IMAGE</div><div class="n">ダミーの実習名</div></div>
      <div><div class="im">IMAGE</div><div class="n">ダミーの実習名</div></div>
      <div><div class="im">IMAGE</div><div class="n">ダミーの実習名</div></div>
      <div><div class="im">IMAGE</div><div class="n">ダミーの実習名</div></div>
    </div></div>
    <div class="pn" style="left:56px;top:1060px">14</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
