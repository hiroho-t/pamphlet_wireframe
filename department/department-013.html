<!DOCTYPE html>
<html lang="ja">
<head>

<title>department-013</title>
<style>

  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}

  .tb{position:absolute;left:56px;top:190px;width:682px;border-collapse:collapse;font-size:12px}
  .tb th{width:150px;background:#f0f0f0;padding:14px 16px;text-align:left;font-size:11px;font-weight:700;color:#1a1a1a;border-bottom:1px solid #fff;vertical-align:top}
  .tb td{padding:14px 16px;border-bottom:1px solid #e6e6e6;color:#4d4d4d;line-height:1.95}

</head>
<body>

    <div class="pn" style="left:56px;top:1060px">12</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
