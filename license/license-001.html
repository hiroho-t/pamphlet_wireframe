<!DOCTYPE html>
<html lang="ja">
<head>

<title>license-001</title>
<style>

  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .gp{position:absolute;left:56px;width:682px;border:1px solid #d5d5d5}
  .gp .t{padding:12px 18px;background:#f0f0f0;font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a}
  .gp .b{padding:16px 18px}
  .gp li{list-style:none;display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #ececec;font-size:11.5px;color:#4d4d4d}
  .gp li:last-child{border-bottom:0}
  .gp li b{font-weight:700;color:#1a1a1a}

</head>

<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
