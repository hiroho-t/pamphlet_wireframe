<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-013</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .l{position:absolute;left:0;top:0;width:220px;height:1123px;background:#6b6b6b}
  .l .n{position:absolute;left:40px;top:80px;font-size:11px;letter-spacing:.24em;color:#e0e0e0}
  .l .v{position:absolute;left:36px;top:120px;font-size:84px;font-weight:800;line-height:1;color:#fff}
  .h1{position:absolute;left:280px;top:120px;font-size:38px;font-weight:800;line-height:1.5;letter-spacing:.1em;color:#1a1a1a}
  .lead{position:absolute;left:280px;width:458px;top:280px;font-size:12.5px;line-height:2.2;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="l"><div class="n">CHAPTER</div><div class="v">01</div></div>
    <div class="h1">ダミーの<br>章タイトル</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:280px;top:420px;width:458px;height:600px">IMAGE</div>
    <div class="pn" style="left:40px;top:1040px;color:#d5d5d5">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
