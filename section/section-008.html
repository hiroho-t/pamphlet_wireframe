<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-008</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#1a1a1a}
  .no{position:absolute;left:0;width:794px;top:400px;text-align:center;font-size:120px;font-weight:800;line-height:1;color:#3a3a3a}
  .h1{position:absolute;left:0;width:794px;top:520px;text-align:center;font-size:38px;font-weight:800;letter-spacing:.16em;color:#fff}
  .ln{position:absolute;left:357px;top:600px;width:80px;height:1px;background:#fff}
  .lead{position:absolute;left:197px;width:400px;top:630px;text-align:center;font-size:12px;line-height:2.2;color:#d5d5d5}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="no">01</div>
    <div class="h1">ダミーの章タイトル</div>
    <div class="ln"></div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="pn" style="left:0;width:794px;text-align:center;top:1040px;color:#8c8c8c">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
