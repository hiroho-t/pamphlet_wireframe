<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-009</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .no{position:absolute;right:56px;top:80px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .band{position:absolute;left:0;top:300px;width:640px;height:200px;background:#fff;display:flex;align-items:center;padding-left:56px}
  .band .t{font-size:40px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:480px;top:540px;font-size:12.5px;line-height:2.2;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:1123px;background:#c9c9c9;font-size:14px">IMAGE（全面）</div>
    <div class="no">CHAPTER 01</div>
    <div class="band"><div class="t">ダミーの章タイトル</div></div>
    <div class="ph" style="left:0;top:500px;width:640px;height:400px;background:#fff;color:#8c8c8c">IMAGE</div>
    <div class="pn" style="right:56px;top:1064px;color:#fff">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
