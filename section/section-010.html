<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}

  .no{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:104px;font-size:36px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:500px;top:180px;font-size:12.5px;line-height:2.15;color:#4d4d4d}
  .g{position:absolute;left:56px;top:300px;width:682px;display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
  .g .it{border-top:1px solid #1a1a1a;padding-top:14px}
  .g .it .n{font-size:10px;letter-spacing:.2em;color:#8c8c8c}
  .g .it .t{margin-top:6px;font-size:15px;font-weight:800;color:#1a1a1a}
  .g .it .p{margin-top:6px;font-size:11px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">

    <div class="g">
      <div class="it"><div class="n">01</div><div class="t">ダミーの項目名</div><div class="p">P.04</div></div>
      <div class="it"><div class="n">02</div><div class="t">ダミーの項目名</div><div class="p">P.06</div></div>
      <div class="it"><div class="n">03</div><div class="t">ダミーの項目名</div><div class="p">P.08</div></div>
      <div class="it"><div class="n">04</div><div class="t">ダミーの項目名</div><div class="p">P.10</div></div>

    <div class="ph" style="left:56px;top:540px;width:682px;height:480px">IMAGE</div>

  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
