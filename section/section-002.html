<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bg{position:absolute;inset:0;background:#6b6b6b}
  .no{position:absolute;left:64px;top:400px;font-size:13px;letter-spacing:.3em;color:#d5d5d5}
  .h1{position:absolute;left:64px;top:440px;font-size:52px;font-weight:800;line-height:1.4;letter-spacing:.08em;color:#fff}
  .lead{position:absolute;left:64px;width:440px;top:610px;font-size:12.5px;line-height:2.2;color:#e6e6e6}
  .ln{position:absolute;left:64px;top:392px;width:80px;height:2px;background:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bg"></div>
    <div class="ln"></div>
    <div class="no">CHAPTER 01</div>
    <div class="h1">ダミーの<br>章タイトル</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="pn" style="right:64px;top:1040px;color:#d5d5d5">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
