<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-012</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}

  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .box{position:absolute;left:56px;top:340px;width:682px;height:440px;border:2px solid #1a1a1a;display:grid;place-items:center;align-content:center;gap:20px}

  .box .t{font-size:40px;font-weight:800;letter-spacing:.12em;color:#1a1a1a}
  .box .x{width:440px;text-align:center;font-size:12px;line-height:2.15;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="box"><div class="n">CHAPTER 01</div><div class="t">ダミーの章タイトル</div><div class="x">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div></div>
    <div class="pn" style="left:0;width:794px;text-align:center;top:1060px">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
