<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-017</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .no{position:absolute;left:56px;top:760px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:790px;font-size:38px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:500px;top:870px;font-size:12.5px;line-height:2.15;color:#4d4d4d}
  .rule{position:absolute;left:56px;top:740px;width:682px;height:1px;background:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:530px;height:700px">IMAGE 1</div>
    <div class="ph" style="left:530px;top:0;width:264px;height:350px;background:#d0d0d0">IMAGE 2</div>
    <div class="ph" style="left:530px;top:350px;width:264px;height:350px">IMAGE 3</div>
    <div class="rule"></div>
    <div class="no">CHAPTER 01</div>
    <div class="h1">ダミーの章タイトル</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="pn" style="right:56px;top:1060px">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
