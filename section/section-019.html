<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .ttl{position:absolute;right:61px;top:386px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:52px;letter-spacing:.24em;color:#1a1a1a;white-space:nowrap}
  .ls{position:absolute;left:373px;top:468px;font-size:11px;line-height:2.5;color:#4d4d4d}
  .it{position:absolute;left:362px;font-size:13px;font-weight:700;color:#1a1a1a}
  .it::before{content:"■ ";color:#6b6b6b}
  .sb{position:absolute;left:382px;font-size:8px;color:#6b6b6b}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ttl">各種出願書類</div>
    <div class="ls">・総合型選抜（ダミー入学）<br>・学校推薦入学<br>・自己推薦入学<br>・一般入学</div>
    <div class="it" style="top:612px">入学願書（全出願区分 共通）</div>
    <div class="it" style="top:652px">学校推薦書</div>
    <div class="sb" style="top:672px">・学校推薦入学を希望される方のみ提出</div>
    <div class="it" style="top:694px">自己推薦書</div>
    <div class="sb" style="top:714px">・自己推薦入学を希望される方のみ提出</div>
    <div class="pn" style="left:748px;top:1092px">127</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
