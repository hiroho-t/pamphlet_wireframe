<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .no{position:absolute;left:56px;top:96px;font-size:130px;font-weight:800;line-height:1;letter-spacing:.02em;color:#1a1a1a}
  .eye{position:absolute;left:240px;top:130px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:240px;top:156px;font-size:32px;font-weight:800;line-height:1.5;letter-spacing:.1em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:520px;top:290px;font-size:12.5px;line-height:2.2;color:#4d4d4d}
  .lst{position:absolute;left:56px;top:400px;width:682px}
  .lst li{list-style:none;display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #d5d5d5;font-size:13px;color:#1a1a1a}
  .lst li:last-child{border-bottom:1px solid #d5d5d5}
  .lst li span{font-size:12px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="no">01</div>
    <div class="eye">CHAPTER</div>
    <div class="h1">ダミーの<br>章タイトル</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <ul class="lst">
      <li>ダミーの項目名<span>P.04</span></li>
      <li>ダミーの項目名<span>P.06</span></li>
      <li>ダミーの項目名<span>P.08</span></li>
      <li>ダミーの項目名<span>P.10</span></li>
    </ul>
    <div class="ph" style="left:56px;top:640px;width:682px;height:380px">IMAGE</div>
    <div class="pn" style="left:56px;top:1060px">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
