<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .bar{position:absolute;left:0;top:0;width:794px;height:8px;background:#1a1a1a}
  .no{position:absolute;left:56px;top:120px;font-size:13px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:160px;font-size:44px;font-weight:800;line-height:1.4;letter-spacing:.08em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:500px;top:320px;font-size:12.5px;line-height:2.2;color:#4d4d4d}
  .lst{position:absolute;left:56px;top:440px;width:682px;display:flex;flex-wrap:wrap;gap:10px}
  .lst span{padding:9px 16px;border:1px solid #d5d5d5;font-size:12px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="bar"></div>
    <div class="no">CHAPTER 01</div>
    <div class="h1">ダミーの章タイトル</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="lst"><span>ダミーの項目</span><span>ダミーの項目</span><span>ダミーの項目</span><span>ダミーの項目</span><span>ダミーの項目</span></div>
    <div class="ph" style="left:56px;top:540px;width:682px;height:480px">IMAGE</div>
    <div class="pn" style="left:56px;top:1060px">03</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
