<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>support-015</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .tb{position:absolute;left:56px;width:682px;border-collapse:collapse;font-size:11px}
  .tb th{background:#6b6b6b;color:#fff;padding:10px 8px;font-size:10.5px;font-weight:700;border:1px solid #6b6b6b}
  .tb td{padding:12px 8px;border:1px solid #e6e6e6;color:#4d4d4d;text-align:center;line-height:1.65}
  .tb td.n{text-align:left;font-weight:700;color:#1a1a1a}
  .nt{position:absolute;left:56px;width:682px;font-size:10.5px;line-height:1.9;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">PAYMENT SCHEDULE</div>
    <div class="h1">納入時期と方法</div>
    <table class="tb" style="top:180px"><thead><tr><th style="width:150px">納入区分</th><th>納入時期</th><th>金額</th><th>納入方法</th></tr></thead><tbody>
      <tr><td class="n">入学手続時</td><td>合格発表後 2週間以内</td><td>800,000円</td><td>指定口座へ振込</td></tr>
      <tr><td class="n">前期分</td><td>4月中</td><td>600,000円</td><td>口座振替</td></tr>
      <tr><td class="n">後期分</td><td>9月中</td><td>600,000円</td><td>口座振替</td></tr>
      <tr><td class="n">諸会費</td><td>入学時</td><td>45,000円</td><td>指定口座へ振込</td></tr>
    </tbody></table>
    <div class="nt" style="top:400px">※分納制度をご利用いただけます。詳細はお問い合わせください。<br>※ダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:480px;width:682px;height:270px;font-size:12px">GRAPHIC（納入スケジュール図）</div>
    <div class="ph" style="left:56px;top:780px;width:682px;height:240px">IMAGE</div>
    <div class="pn" style="left:56px;top:1064px">60</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
