<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>access-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .r{position:absolute;left:56px;width:682px;display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #e6e6e6}
  .r .l{flex:none;width:200px;font-size:12.5px;font-weight:700;color:#1a1a1a}
  .r .x{flex:1;font-size:11.5px;color:#4d4d4d}
  .r .t{flex:none;width:90px;text-align:right;font-size:12px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">ACCESS TIME</div>
    <div class="h1">主要駅からの所要時間</div>
    <div class="ph" style="left:56px;top:180px;width:682px;height:300px;font-size:12px">MAP（路線図）</div>
    <div class="r" style="top:520px"><div class="l">ダミー駅から</div><div class="x">ダミー線 → ダミー駅下車 → 徒歩</div><div class="t">約25分</div></div>
    <div class="r" style="top:585px"><div class="l">ダミー駅から</div><div class="x">ダミー線 → ダミー駅下車 → バス</div><div class="t">約35分</div></div>
    <div class="r" style="top:650px"><div class="l">ダミー空港から</div><div class="x">リムジンバス → ダミー駅 → 徒歩</div><div class="t">約70分</div></div>
    <div class="r" style="top:715px"><div class="l">ダミーICから</div><div class="x">車（駐車場あり／要事前申請）</div><div class="t">約15分</div></div>
    <div class="r" style="top:780px"><div class="l">ダミー駅から</div><div class="x">スクールバス（10〜15分間隔）</div><div class="t">約12分</div></div>
    <div class="ph" style="left:56px;top:860px;width:682px;height:160px">IMAGE</div>
    <div class="pn" style="right:56px;top:1064px">76</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
