<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>access-001</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:30px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .t{position:absolute;left:56px;width:682px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:9px;border-bottom:1px solid #1a1a1a}
  .rt{position:absolute;left:56px;width:682px}
  .rt .r{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #e6e6e6}
  .rt .r .l{flex:none;width:180px;font-size:12px;font-weight:700;color:#1a1a1a}
  .rt .r .x{font-size:11.5px;color:#4d4d4d}
  .dl{position:absolute;left:56px;width:682px}
  .dl .r{display:flex;gap:20px;padding:11px 0;border-bottom:1px solid #e6e6e6}
  .dl .r dt{flex:none;width:120px;font-size:11px;color:#8c8c8c}
  .dl .r dd{font-size:11.5px;color:#1a1a1a;line-height:1.8}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">ACCESS</div>
    <div class="h1">アクセス</div>
    <div class="ph" style="left:56px;top:180px;width:682px;height:330px;font-size:13px">MAP</div>
    <div class="t" style="top:550px">交通アクセス</div>
    <div class="rt" style="top:590px">
      <div class="r"><div class="l">ダミー駅から</div><div class="x">徒歩00分／バス00分（ダミーバス停下車）</div></div>
      <div class="r"><div class="l">ダミー駅から</div><div class="x">徒歩00分／スクールバス00分</div></div>
      <div class="r"><div class="l">ダミーICから</div><div class="x">車で約00分</div></div>
    </div>
    <div class="t" style="top:760px">所在地</div>
    <div class="dl" style="top:800px">
      <div class="r"><dt>キャンパス</dt><dd>ダミーキャンパス</dd></div>
      <div class="r"><dt>住所</dt><dd>〒000-0000 ダミー県ダミー市ダミー町0-0-0</dd></div>
      <div class="r"><dt>TEL</dt><dd>000-000-0000（入試広報課）</dd></div>
      <div class="r"><dt>受付時間</dt><dd>平日 9:00〜17:00</dd></div>
    </div>
    <div class="pn" style="left:56px;top:1060px">76</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
