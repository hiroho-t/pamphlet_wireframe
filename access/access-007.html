<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>access-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .tb{position:absolute;left:56px;top:180px;width:682px;border-collapse:collapse;font-size:11.5px}
  .tb th{width:170px;background:#f0f0f0;padding:14px 16px;text-align:left;font-size:11px;font-weight:700;color:#1a1a1a;border-bottom:1px solid #fff;vertical-align:top}
  .tb td{padding:14px 16px;border-bottom:1px solid #e6e6e6;color:#4d4d4d;line-height:1.9}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">SCHOOL DATA</div>
    <div class="h1">学校法人の概要</div>
    <table class="tb"><tbody>
      <tr><th>法人名</th><td>学校法人ダミー学園</td></tr>
      <tr><th>理事長</th><td>ダミー 太郎</td></tr>
      <tr><th>設立</th><td>19XX年X月</td></tr>
      <tr><th>本部所在地</th><td>〒000-0000 ダミー県ダミー市ダミー町0-0-0</td></tr>
      <tr><th>設置校</th><td>ダミー大学／ダミー短期大学／ダミー高等学校／ダミー専門学校</td></tr>
      <tr><th>在籍者数</th><td>0,000名（20XX年5月1日現在）</td></tr>
      <tr><th>教職員数</th><td>000名（20XX年5月1日現在）</td></tr>
      <tr><th>URL</th><td>https://dummy.example.ac.jp/</td></tr>
    </tbody></table>
    <div class="ph" style="left:56px;top:700px;width:682px;height:320px">IMAGE</div>
    <div class="pn" style="left:56px;top:1064px">78</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
