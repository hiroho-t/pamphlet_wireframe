<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>access-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:640px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:666px;font-size:28px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .dl{position:absolute;left:56px;top:730px;width:400px}
  .dl .r{display:flex;gap:20px;padding:11px 0;border-bottom:1px solid #e6e6e6}
  .dl dt{flex:none;width:100px;font-size:11px;color:#8c8c8c}
  .dl dd{font-size:11.5px;line-height:1.8;color:#1a1a1a}
  .bx{position:absolute;left:490px;top:730px;width:248px;border:1px solid #d5d5d5;padding:20px}
  .bx .t{font-size:11px;letter-spacing:.14em;color:#8c8c8c;padding-bottom:9px;border-bottom:1px solid #d5d5d5}
  .bx li{list-style:none;padding:9px 0;border-bottom:1px solid #e6e6e6;font-size:11.5px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:794px;height:600px;font-size:13px">MAP（広域）</div>
    <div class="en">ACCESS</div>
    <div class="h1">アクセス・お問い合わせ</div>
    <dl class="dl">
      <div class="r"><dt>住所</dt><dd>〒000-0000<br>ダミー県ダミー市ダミー町0-0-0</dd></div>
      <div class="r"><dt>TEL</dt><dd>000-000-0000（入試広報課）</dd></div>
      <div class="r"><dt>MAIL</dt><dd>dummy@example.ac.jp</dd></div>
      <div class="r"><dt>受付時間</dt><dd>平日 9:00〜17:00</dd></div>
    </dl>
    <div class="bx"><div class="t">交通アクセス</div><ul><li>ダミー駅から徒歩00分</li><li>ダミー駅からバス00分</li><li>ダミーICから車で00分</li><li>スクールバス運行あり</li></ul></div>
    <div class="pn" style="left:56px;top:1060px">76</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
