<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>access-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .tb{position:absolute;left:56px;top:180px;width:682px;border-collapse:collapse;font-size:11px}
  .tb th{background:#6b6b6b;color:#fff;padding:11px 10px;text-align:left;font-size:10.5px;font-weight:700}
  .tb td{padding:12px 10px;border-bottom:1px solid #e6e6e6;color:#4d4d4d;line-height:1.7}
  .tb td.n{font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">SCHOOL BUS</div>
    <div class="h1">スクールバス時刻表</div>

      <tr><td class="n">本学 → ダミー駅</td><td>8:10</td><td>20:00</td><td>10〜15分</td></tr>
      <tr><td class="n">ダミー駅 → 本学</td><td>8:00</td><td>18:30</td><td>20分</td></tr>
      <tr><td class="n">本学 → ダミー駅</td><td>8:30</td><td>19:00</td><td>20分</td></tr>
    </tbody></table>
    <div class="ph" style="left:56px;top:420px;width:682px;height:300px;font-size:12px">MAP（バス路線）</div>
    <div class="ph" style="left:56px;top:750px;width:333px;height:270px">IMAGE</div>
    <div class="ph" style="left:405px;top:750px;width:333px;height:270px">IMAGE</div>
    <div class="pn" style="right:56px;top:1064px">76</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
