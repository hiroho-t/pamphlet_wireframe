<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>access-005</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:30px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .t{position:absolute;left:56px;width:682px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:9px;border-bottom:1px solid #1a1a1a}
  .rt{position:absolute;left:56px;width:682px}
  .rt .ln{position:absolute;left:8px;top:14px;width:1px;height:100%;background:#d5d5d5}
  .rt .st{position:relative;padding:14px 0 14px 40px}
  .rt .st .d{position:absolute;left:2px;top:20px;width:13px;height:13px;border-radius:50%;border:2px solid #1a1a1a;background:#fff}
  .rt .st .n{font-size:13px;font-weight:800;color:#1a1a1a}
  .rt .st .x{margin-top:4px;font-size:11px;color:#8c8c8c}
  .bx{position:absolute;left:56px;width:682px;border:1px solid #d5d5d5;padding:20px 24px}
  .bx .h{font-size:12.5px;font-weight:800;color:#1a1a1a}
  .bx .x{margin-top:8px;font-size:11.5px;line-height:1.95;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">ACCESS</div>
    <div class="h1">キャンパスまでのルート</div>
    <div class="ph" style="left:56px;top:180px;width:682px;height:280px;font-size:13px">MAP</div>
    <div class="t" style="top:500px">ダミー駅からのルート</div>
    <div class="rt" style="top:540px;height:280px">
      <div class="ln"></div>
      <div class="st"><div class="d"></div><div class="n">ダミー駅 東口</div><div class="x">出発</div></div>
      <div class="st"><div class="d"></div><div class="n">ダミー通り</div><div class="x">徒歩5分</div></div>
      <div class="st"><div class="d"></div><div class="n">ダミー交差点</div><div class="x">徒歩3分</div></div>
      <div class="st"><div class="d"></div><div class="n">ダミーキャンパス 正門</div><div class="x">徒歩2分／計10分</div></div>
    </div>
    <div class="bx" style="top:860px"><div class="h">スクールバスのご案内</div><div class="x">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div></div>
    <div class="pn" style="right:56px;top:1060px">76</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
