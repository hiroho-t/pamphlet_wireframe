<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:30px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .l{position:absolute;left:56px;top:180px;width:329px}
  .r{position:absolute;left:409px;top:180px;width:329px}
  .t{font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
  .mo{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #e6e6e6}
  .mo .m{flex:none;width:44px;font-size:11px;font-weight:800;color:#1a1a1a}
  .mo .x{font-size:11.5px;line-height:1.75;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">SCHEDULE</div>
    <div class="h1">年間スケジュール</div>
    <div class="l"><div class="t">前期</div>
      <div class="mo"><div class="m">4月</div><div class="x">ダミーの行事名／ダミーの行事名</div></div>
      <div class="mo"><div class="m">5月</div><div class="x">ダミーの行事名</div></div>
      <div class="mo"><div class="m">6月</div><div class="x">ダミーの行事名／ダミーの行事名</div></div>
      <div class="mo"><div class="m">7月</div><div class="x">ダミーの行事名</div></div>
      <div class="mo"><div class="m">8月</div><div class="x">ダミーの行事名／ダミーの行事名</div></div>
      <div class="mo"><div class="m">9月</div><div class="x">ダミーの行事名</div></div>
    </div>
    <div class="r"><div class="t">後期</div>
      <div class="mo"><div class="m">10月</div><div class="x">ダミーの行事名／ダミーの行事名</div></div>
      <div class="mo"><div class="m">11月</div><div class="x">ダミーの行事名</div></div>
      <div class="mo"><div class="m">12月</div><div class="x">ダミーの行事名／ダミーの行事名</div></div>
      <div class="mo"><div class="m">1月</div><div class="x">ダミーの行事名</div></div>
      <div class="mo"><div class="m">2月</div><div class="x">ダミーの行事名／ダミーの行事名</div></div>
      <div class="mo"><div class="m">3月</div><div class="x">ダミーの行事名</div></div>
    </div>
    <div class="ph" style="left:56px;top:560px;width:333px;height:220px">IMAGE</div>
    <div class="ph" style="left:405px;top:560px;width:333px;height:220px">IMAGE</div>
    <div class="ph" style="left:56px;top:800px;width:216px;height:216px">IMAGE</div>
    <div class="ph" style="left:289px;top:800px;width:216px;height:216px">IMAGE</div>
    <div class="ph" style="left:522px;top:800px;width:216px;height:216px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">20</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
