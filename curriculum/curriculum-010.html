<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .ring{position:absolute;left:197px;top:200px;width:400px;height:400px;border-radius:50%;border:1px solid #d5d5d5}
  .ring .in{position:absolute;left:100px;top:100px;width:200px;height:200px;border-radius:50%;background:#6b6b6b;display:grid;place-items:center;text-align:center;font-size:14px;font-weight:800;line-height:1.6;color:#fff}
  .lb{position:absolute;width:150px;text-align:center;font-size:11.5px;line-height:1.7;color:#4d4d4d}
  .lb b{display:block;font-size:13px;font-weight:800;color:#1a1a1a}
  .bd{position:absolute;left:56px;width:682px;top:660px;font-size:12.5px;line-height:2.2;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">

    <div class="h1">学びの構造</div>
    <div class="ring"><div class="in">ダミーの<br>人材像</div></div>
    <div class="lb" style="left:322px;top:220px"><b>ダミーの領域</b>ダミーテキスト</div>
    <div class="lb" style="left:500px;top:380px"><b>ダミーの領域</b>ダミーテキスト</div>
    <div class="lb" style="left:322px;top:530px"><b>ダミーの領域</b>ダミーテキスト</div>
    <div class="lb" style="left:144px;top:380px"><b>ダミーの領域</b>ダミーテキスト</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:790px;width:682px;height:230px">IMAGE</div>
    <div class="pn" style="left:56px;top:1060px">18</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
