<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-005</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .en{position:absolute;left:0;width:794px;top:76px;text-align:center;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:0;width:794px;top:102px;text-align:center;font-size:30px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .ly{position:absolute;left:56px;width:682px;display:grid;place-items:center;font-weight:700;color:#1a1a1a}
  .l1{height:70px;background:#6b6b6b;color:#fff;font-size:17px;letter-spacing:.08em}
  .l2{height:64px;background:#c9c9c9;font-size:15px}
  .l3{height:64px;background:#dedede;font-size:14px}
  .l4{height:64px;background:#f0f0f0;font-size:13px}
  .tag{position:absolute;left:0;width:794px;display:flex;justify-content:center;gap:10px}
  .tag span{padding:8px 14px;border:1px solid #d5d5d5;font-size:11.5px;color:#4d4d4d}
  .lead{position:absolute;left:157px;width:480px;top:800px;text-align:center;font-size:12px;line-height:2.1;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">CURRICULUM</div>
    <div class="h1">学びの体系</div>
    <div class="ly l1" style="top:190px">卒業研究・卒業制作</div>
    <div class="ly l2" style="top:288px">専門応用科目</div>
    <div class="ly l3" style="top:376px">専門基礎科目</div>
    <div class="ly l4" style="top:464px">共通教養科目</div>
    <div class="tag" style="top:570px"><span>ダミーの科目群</span><span>ダミーの科目群</span><span>ダミーの科目群</span><span>ダミーの科目群</span></div>

    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:900px;width:682px;height:120px">IMAGE</div>
    <div class="pn" style="left:0;width:794px;text-align:center;top:1060px">18</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
