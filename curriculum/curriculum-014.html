<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-014</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .h1{position:absolute;left:0;width:794px;top:100px;text-align:center;font-size:29px;font-weight:800;letter-spacing:.1em;color:#1a1a1a}
  .eye{position:absolute;left:0;width:794px;top:76px;text-align:center;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .py{position:absolute;left:0;width:794px}
  .py div{margin:0 auto;height:76px;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;border:1px solid #1a1a1a;margin-bottom:14px}
  .lb{position:absolute;left:56px;font-size:10.5px;letter-spacing:.14em;color:#8c8c8c}
  .bd{position:absolute;left:137px;width:520px;top:640px;text-align:center;font-size:12.5px;line-height:2.2;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CURRICULUM PYRAMID</div>
    <div class="h1">積み上げる4年間</div>
    <div class="py" style="top:190px">
      <div style="width:260px;background:#6b6b6b;color:#fff;border-color:#6b6b6b">4年次｜卒業研究</div>
      <div style="width:400px;background:#c9c9c9;border-color:#c9c9c9">3年次｜専門応用</div>
      <div style="width:540px;background:#dedede;border-color:#dedede">2年次｜専門基礎</div>
      <div style="width:682px;background:#f0f0f0;border-color:#f0f0f0">1年次｜共通教養</div>
    </div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="ph" style="left:56px;top:760px;width:333px;height:260px">IMAGE</div>
    <div class="ph" style="left:405px;top:760px;width:333px;height:260px">IMAGE</div>
    <div class="pn" style="left:0;width:794px;text-align:center;top:1060px">18</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
