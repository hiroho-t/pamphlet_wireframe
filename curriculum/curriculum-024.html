<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-024</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .lead{position:absolute;left:56px;width:560px;top:150px;font-size:12px;line-height:2.05;color:#4d4d4d}
  .m{position:absolute;width:159px}
  .m .h{height:34px;background:#f0f0f0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#1a1a1a}
  .m .x{margin-top:10px;font-size:10.5px;line-height:1.85;color:#4d4d4d}
  .m .im{margin-top:10px;width:100%;height:90px;background:#dcdcdc;display:grid;place-items:center;font-size:9px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">

    <div class="m" style="left:56px;top:250px"><div class="h">4-5月</div><div class="x">ダミーテキストダミーテキストダミーテキスト</div><div class="im">IMAGE</div></div>
    <div class="m" style="left:230px;top:250px"><div class="h">6-7月</div><div class="x">ダミーテキストダミーテキストダミーテキスト</div><div class="im">IMAGE</div></div>
    <div class="m" style="left:404px;top:250px"><div class="h">8-9月</div><div class="x">ダミーテキストダミーテキストダミーテキスト</div><div class="im">IMAGE</div></div>

    <div class="m" style="left:56px;top:500px"><div class="h">12-1月</div><div class="x">ダミーテキストダミーテキストダミーテキスト</div><div class="im">IMAGE</div></div>

    <div class="ph" style="left:404px;top:500px;width:334px;height:210px">IMAGE</div>
    <div class="ph" style="left:56px;top:760px;width:682px;height:260px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">20</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
