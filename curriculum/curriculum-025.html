<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-025</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .q{position:absolute;left:56px;width:560px;top:150px;font-size:20px;font-weight:800;line-height:1.85;color:#1a1a1a}
  .bd{position:absolute;left:56px;width:400px;top:290px;font-size:12px;line-height:2.15;color:#4d4d4d}
  .bx{position:absolute;left:490px;top:290px;width:248px;border:1px solid #d5d5d5;padding:20px}
  .bx .t{font-size:11px;letter-spacing:.14em;color:#8c8c8c;padding-bottom:9px;border-bottom:1px solid #d5d5d5}
  .bx li{list-style:none;padding:8px 0;border-bottom:1px solid #ececec;font-size:11px;color:#4d4d4d}
  .st{position:absolute;top:620px;width:213px;height:130px;border:1px solid #d5d5d5;display:grid;place-items:center;align-content:center;gap:6px}
  .st .l{font-size:10.5px;color:#8c8c8c}
  .st .v{font-size:32px;font-weight:800;line-height:1;color:#1a1a1a}
  .st .v small{font-size:13px}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">SMALL CLASS</div>
    <div class="h1">少人数教育</div>
    <div class="q">ダミーの見出しテキストがここに入ります</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="bx"><div class="t">少人数科目の例</div><ul><li>ダミーの科目名</li><li>ダミーの科目名</li><li>ダミーの科目名</li><li>ダミーの科目名</li></ul></div>
    <div class="st" style="left:56px"><div class="l">1クラスの人数</div><div class="v">18<small>名</small></div></div>
    <div class="st" style="left:290px"><div class="l">教員1人あたり</div><div class="v">12<small>名</small></div></div>
    <div class="st" style="left:524px"><div class="l">ゼミの平均人数</div><div class="v">8<small>名</small></div></div>
    <div class="ph" style="left:56px;top:790px;width:682px;height:230px">IMAGE</div>
    <div class="pn" style="left:56px;top:1060px">18</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
