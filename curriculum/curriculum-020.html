<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curriculum-020</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:29px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .g{position:absolute;left:56px;top:180px;width:682px;height:300px;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .t{position:absolute;left:56px;width:682px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
  .r{position:absolute;left:56px;width:682px;display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid #ececec}
  .r .n{flex:none;width:170px;font-size:12px;color:#1a1a1a}
  .r .b{flex:1;height:16px;background:#f0f0f0;position:relative}
  .r .b i{position:absolute;left:0;top:0;height:16px;background:#6b6b6b}
  .r .v{flex:none;width:60px;text-align:right;font-size:11.5px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CREDIT STRUCTURE</div>
    <div class="h1">卒業要件と単位構成</div>
    <div class="g">GRAPH（単位構成）</div>
    <div class="t" style="top:520px">科目区分別の必要単位</div>
    <div class="r" style="top:570px"><div class="n">教養科目</div><div class="b"><i style="width:30%"></i></div><div class="v">24単位</div></div>
    <div class="r" style="top:622px"><div class="n">専門基礎科目</div><div class="b"><i style="width:45%"></i></div><div class="v">36単位</div></div>
    <div class="r" style="top:674px"><div class="n">専門科目</div><div class="b"><i style="width:70%"></i></div><div class="v">56単位</div></div>
    <div class="r" style="top:726px"><div class="n">実習・演習</div><div class="b"><i style="width:25%"></i></div><div class="v">20単位</div></div>
    <div class="r" style="top:778px"><div class="n">卒業研究</div><div class="b"><i style="width:10%"></i></div><div class="v">8単位</div></div>
    <div class="r" style="top:830px"><div class="n">合計（卒業要件）</div><div class="b"><i style="width:100%;background:#1a1a1a"></i></div><div class="v">124単位</div></div>
    <div class="ph" style="left:56px;top:900px;width:682px;height:120px">IMAGE</div>
    <div class="pn" style="right:56px;top:1060px">18</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
