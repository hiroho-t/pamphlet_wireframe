<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guidelines-001</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .rule{position:absolute;left:56px;width:682px;height:2px;background:#1a1a1a}
  .yr{position:absolute;left:0;width:794px;top:300px;text-align:center;font-size:22px;font-weight:700;letter-spacing:.24em;color:#4d4d4d}
  .ttl{position:absolute;left:0;width:794px;top:360px;text-align:center;font-size:52px;font-weight:800;line-height:1.45;letter-spacing:.12em;color:#1a1a1a}
  .sub{position:absolute;left:0;width:794px;top:540px;text-align:center;font-size:15px;letter-spacing:.16em;color:#4d4d4d}
  .lst{position:absolute;left:197px;width:400px;top:620px;text-align:center;font-size:12px;line-height:2.2;color:#4d4d4d}
  .logo{position:absolute;left:0;width:794px;top:940px;text-align:center;font-size:20px;font-weight:800;letter-spacing:.14em;color:#1a1a1a}
  .nt{position:absolute;left:0;width:794px;top:1000px;text-align:center;font-size:10.5px;letter-spacing:.06em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="rule" style="top:240px"></div>
    <div class="yr">20XX年度</div>
    <div class="ttl">学生募集要項</div>
    <div class="sub">ダミー大学 ダミー学部</div>
    <div class="lst">ダミー入試／ダミー入試／ダミー入試<br>ダミー入試／ダミー入試</div>
    <div class="rule" style="top:880px"></div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="nt">出願前に必ず本要項を熟読してください。</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
