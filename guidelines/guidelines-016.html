<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guidelines-016</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:100px;font-size:26px;font-weight:800;letter-spacing:.07em;color:#1a1a1a}
  .b{position:absolute;left:56px;width:682px;border:1px solid #1a1a1a;padding:22px 26px}
  .b .t{font-size:16px;font-weight:800;letter-spacing:.06em;color:#1a1a1a;padding-bottom:12px;border-bottom:1px solid #d5d5d5}
  .b .r{display:flex;gap:20px;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:11.5px;color:#4d4d4d}
  .b .r dt{flex:none;width:110px;font-weight:700;color:#1a1a1a}
  .logo{position:absolute;left:0;width:794px;top:880px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.14em;color:#1a1a1a}
  .cp{position:absolute;left:0;width:794px;top:1040px;text-align:center;font-size:10px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">CONTACT</div>
    <div class="h1">問い合わせ先</div>
    <div class="b" style="top:180px"><div class="t">入試に関するお問い合わせ</div>
      <div class="r"><dt>窓口</dt><dd>ダミー大学 入試広報課</dd></div>
      <div class="r"><dt>住所</dt><dd>〒000-0000 ダミー県ダミー市ダミー町0-0-0</dd></div>
      <div class="r"><dt>電話</dt><dd>000-000-0000（直通）</dd></div>
      <div class="r"><dt>受付時間</dt><dd>平日 9:00〜17:00（土日祝を除く）</dd></div>
      <div class="r"><dt>メール</dt><dd>dummy@example.ac.jp</dd></div>
      <div class="r"><dt>Web</dt><dd>https://dummy.example.ac.jp/</dd></div>
    </div>
    <div class="b" style="top:490px"><div class="t">学費・奨学金に関するお問い合わせ</div>
      <div class="r"><dt>窓口</dt><dd>ダミー大学 学生支援課</dd></div>
      <div class="r"><dt>電話</dt><dd>000-000-0000（直通）</dd></div>
      <div class="r"><dt>受付時間</dt><dd>平日 9:00〜17:00（土日祝を除く）</dd></div>
    </div>
    <div class="ph" style="left:334px;top:700px;width:126px;height:126px">QR</div>
    <div class="logo">SCHOOL LOGO</div>
    <div class="cp">© 20XX Dummy School.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
