<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .en{position:absolute;left:56px;top:96px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:124px;font-size:34px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .lg{position:absolute;left:850px;top:210px;width:682px}
  .lg .r{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid #e6e6e6}
  .lg .r .n{flex:none;width:26px;height:26px;border:1px solid #1a1a1a;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1a1a1a}
  .lg .r .t{font-size:12.5px;font-weight:700;color:#1a1a1a}
  .lg .r .x{margin-left:auto;font-size:10.5px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="en">CAMPUS MAP</div>
    <div class="h1">キャンパスマップ</div>
    <div class="ph" style="left:56px;top:210px;width:700px;height:640px;font-size:14px">CAMPUS MAP</div>
    <div class="lg">
      <div class="r"><div class="n">1</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">2</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">3</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">4</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">5</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">6</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">7</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">8</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">9</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
      <div class="r"><div class="n">10</div><div class="t">ダミーの建物名</div><div class="x">ダミーの用途</div></div>
    </div>
    <div class="ph" style="left:850px;top:700px;width:222px;height:150px">IMAGE</div>
    <div class="ph" style="left:1080px;top:700px;width:222px;height:150px">IMAGE</div>
    <div class="ph" style="left:1310px;top:700px;width:222px;height:150px">IMAGE</div>
    <div class="ph" style="left:56px;top:880px;width:700px;height:140px">IMAGE</div>
    <div class="ph" style="left:850px;top:880px;width:682px;height:140px">IMAGE</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px">44</div>
    <div class="pn" style="right:56px;top:1064px">45</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
