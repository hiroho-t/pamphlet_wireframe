<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-034</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  /* 写真だけで構成したスナップ見開き。大小の矩形を重ね・裁ち落としで散らす */
  .cap{position:absolute;font-size:10px;letter-spacing:.22em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:107px;top:6px;width:375px;height:264px">IMAGE</div>
    <div class="ph" style="left:511px;top:19px;width:235px;height:292px">IMAGE</div>
    <div class="ph" style="left:60px;top:249px;width:154px;height:264px">IMAGE</div>
    <div class="ph" style="left:249px;top:342px;width:497px;height:340px">IMAGE</div>
    <div class="ph" style="left:0;top:630px;width:400px;height:237px">IMAGE</div>
    <div class="ph" style="left:416px;top:702px;width:169px;height:165px">IMAGE</div>
    <div class="ph" style="left:49px;top:887px;width:355px;height:236px">IMAGE</div>
    <div class="ph" style="left:416px;top:892px;width:330px;height:202px">IMAGE</div>

    <div class="ph" style="left:832px;top:6px;width:237px;height:392px">IMAGE</div>
    <div class="ph" style="left:1100px;top:54px;width:478px;height:344px">IMAGE</div>
    <div class="cap" style="left:849px;top:410px;width:220px;text-align:center">DUMMY SNAP</div>
    <div class="ph" style="left:832px;top:440px;width:433px;height:314px">IMAGE</div>
    <div class="ph" style="left:1296px;top:440px;width:231px;height:314px">IMAGE</div>
    <div class="ph" style="left:832px;top:781px;width:248px;height:334px">IMAGE</div>
    <div class="ph" style="left:1121px;top:806px;width:406px;height:165px">IMAGE</div>
    <div class="ph" style="left:1121px;top:960px;width:206px;height:124px;background:#d0d0d0">IMAGE</div>
    <div class="gut"></div>
    <div class="pn" style="left:24px;top:1092px">04</div>
    <div class="pn" style="right:24px;top:1092px">05</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
