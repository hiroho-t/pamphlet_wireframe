<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  .shade{position:absolute;left:0;bottom:0;width:1588px;height:360px;background:rgba(0,0,0,.14)}
  .en{position:absolute;left:56px;top:820px;font-size:11px;letter-spacing:.3em;color:#f0f0f0}
  .h1{position:absolute;left:56px;top:850px;font-size:52px;font-weight:800;line-height:1.4;letter-spacing:.06em;color:#fff}
  .lead{position:absolute;left:850px;width:620px;top:880px;font-size:13px;line-height:2.2;color:#f0f0f0}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:0;width:1588px;height:1123px;background:#b9b9b9;font-size:15px">MAIN IMAGE（見開き全面）</div>
    <div class="shade"></div>
    <div class="en">FEATURE</div>
    <div class="h1">ダミーの特集<br>タイトルが入ります</div>
    <div class="lead">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト。</div>
    <div class="gut"></div>
    <div class="pn" style="left:56px;top:1064px;color:#fff">08</div>
    <div class="pn" style="right:56px;top:1064px;color:#fff">09</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
