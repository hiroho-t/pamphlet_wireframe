<!DOCTYPE html>
<!-- traced: 実誌面から採寸して再現 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spread-040</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:1588px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .gut{position:absolute;left:793px;top:0;width:2px;height:1123px;background:repeating-linear-gradient(#c9c9c9 0 8px,transparent 8px 16px)}
  /* 章扉：写真モザイクの間の白い帯にノドをまたぐ英字特大タイトルを置く */
  .mn{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .big{position:absolute;left:74px;top:340px;font-size:52px;letter-spacing:.66em;line-height:1;color:#1a1a1a;white-space:nowrap}
  .sub{position:absolute;left:80px;top:410px;font-size:12px;letter-spacing:.3em;color:#4d4d4d}
  .idx{position:absolute;right:56px;top:723px;text-align:center;color:#8c8c8c}
  .idx .a{font-size:12px;line-height:1}
  .idx .n{font-size:34px;line-height:1.1;color:#6b6b6b}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="ph" style="left:0;top:78px;width:338px;height:229px">IMAGE</div>
    <div class="ph" style="left:344px;top:78px;width:361px;height:229px">IMAGE</div>
    <div class="ph" style="left:715px;top:78px;width:873px;height:635px">IMAGE</div>
    <div class="ph" style="left:0;top:476px;width:338px;height:237px">IMAGE</div>
    <div class="ph" style="left:344px;top:476px;width:361px;height:237px">IMAGE</div>
    <div class="ph" style="left:0;top:719px;width:416px;height:333px">IMAGE</div>
    <div class="ph" style="left:455px;top:719px;width:206px;height:333px">IMAGE</div>
    <div class="ph" style="left:668px;top:719px;width:453px;height:333px">IMAGE</div>
    <div class="ph" style="left:1127px;top:719px;width:461px;height:333px">IMAGE</div>
    <div class="big mn">DUMMY LIFE</div>
    <div class="sub mn">ダミーで送る大学生活</div>
    <div class="idx"><div class="a">≪</div><div class="n mn">2</div><div class="a">≫</div></div>
    <div class="gut"></div>
    <div class="pn" style="left:24px;top:1092px">88</div>
    <div class="pn" style="right:24px;top:1092px">89</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1588,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
