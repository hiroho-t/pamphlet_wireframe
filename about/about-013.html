<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>about-013</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}
  .ph{position:absolute;background:#dcdcdc;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .pn{position:absolute;font-size:11px;letter-spacing:.1em;color:#8c8c8c}
  .eye{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.3em;color:#8c8c8c}
  .h1{position:absolute;left:56px;top:102px;font-size:30px;font-weight:800;letter-spacing:.08em;color:#1a1a1a}
  .b{position:absolute;width:159px;text-align:center}
  .b .c{width:159px;height:159px;border-radius:50%;border:1px solid #1a1a1a;display:grid;place-items:center;align-content:center;gap:4px}
  .b .c .v{font-size:34px;font-weight:800;line-height:1;color:#1a1a1a}
  .b .c .v small{font-size:13px}
  .b .l{margin-top:12px;font-size:11.5px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <div class="eye">DATA</div>
    <div class="h1">数字で見るダミー学園</div>
    <div class="b" style="left:56px;top:190px"><div class="c"><div class="v">1,200<small>名</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:230px;top:190px"><div class="c"><div class="v">98.5<small>%</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:404px;top:190px"><div class="c"><div class="v">42<small>校</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:578px;top:190px"><div class="c"><div class="v">15<small>年</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:56px;top:420px"><div class="c"><div class="v">86<small>%</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:230px;top:420px"><div class="c"><div class="v">320<small>件</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:404px;top:420px"><div class="c"><div class="v">24<small>種</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="b" style="left:578px;top:420px"><div class="c"><div class="v">7.2<small>倍</small></div></div><div class="l">ダミーの項目名</div></div>
    <div class="ph" style="left:56px;top:650px;width:682px;height:280px">IMAGE</div>
    <div class="pn" style="left:56px;top:1000px">06</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/794,innerHeight/1123));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
